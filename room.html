<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DEADLIGHT baked room</title>
<style>
  html,body{margin:0;height:100%;background:#06070a;overflow:hidden;
    font-family:"Cascadia Mono",Consolas,monospace;color:#d8d5c8;}
  #v{position:fixed;top:0;left:0;width:100%;height:100%;display:block;}
  #vig{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at 50% 46%,rgba(0,0,0,0) 38%,rgba(0,0,0,.62) 100%);}
  #cap{position:fixed;left:22px;bottom:20px;font-size:10px;letter-spacing:2px;
    color:rgba(216,213,200,.42);text-transform:uppercase;line-height:2;pointer-events:none;}
  #load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:#06070a;font-size:11px;letter-spacing:4px;color:#6b7164;transition:opacity .5s;}
  #btn{position:fixed;right:22px;bottom:18px;z-index:5;background:none;border:1px solid rgba(255,179,71,.4);
    color:#ffb347;font:inherit;font-size:9px;letter-spacing:2px;padding:8px 12px;cursor:pointer;}
</style>
</head>
<body>
<canvas id="v"></canvas>
<div id="vig"></div>
<div id="cap">DEADLIGHT / BAKED ROOM<br>CC0 PBR ALBEDO · CYCLES GI · TORCH LIVE</div>
<button id="btn">LIGHTMAP ON</button>
<div id="load">LOADING</div>
<script src="three.min.js"></script>
<script src="GLTFLoader.js"></script>
<script>
(function(){
'use strict';
if (typeof THREE === 'undefined') { document.getElementById('load').textContent = 'three.js missing'; return; }

var canvas = document.getElementById('v');
var renderer = new THREE.WebGLRenderer({canvas:canvas, antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight, false);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.86;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

var scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0d11);
scene.fog = new THREE.FogExp2(0x0a0d11, 0.021);

var camera = new THREE.PerspectiveCamera(42, window.innerWidth/window.innerHeight, 0.05, 120);
camera.position.set(1.75, 1.46, 3.9);
camera.lookAt(-0.1, 1.92, -7.6);

var torch = new THREE.SpotLight(0xffd9a8, 2.9, 24, 0.52, 0.72, 1.2);
torch.position.set(0.1, -0.05, 0.1);
torch.target.position.set(0, -0.4, -6);
torch.castShadow = true;
torch.shadow.mapSize.set(1024, 1024);
torch.shadow.bias = -0.0012;
torch.shadow.normalBias = 0.03;
camera.add(torch);
camera.add(torch.target);
scene.add(camera);

scene.add(new THREE.AmbientLight(0x2c3a4e, 0.16));


// graded sky so the arch reads as an opening, not a hole in the world
var skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false,
  uniforms: {
    top:  { value: new THREE.Color(0x0e141a) },
    mid:  { value: new THREE.Color(0x47523f) },
    warm: { value: new THREE.Color(0xc08a56) },
    sunDir: { value: new THREE.Vector3(-0.5, 0.14, -0.85).normalize() }
  },
  vertexShader: 'varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
  fragmentShader: [
    'uniform vec3 top, mid, warm; uniform vec3 sunDir; varying vec3 vDir;',
    'void main(){',
    '  float h = clamp(vDir.y * 1.15 + 0.06, 0.0, 1.0);',
    '  vec3 c = mix(mid, top, pow(h, 0.6));',
    '  float s = max(0.0, dot(normalize(vDir), sunDir));',
    '  c += warm * pow(s, 5.0) * 0.5 + warm * pow(s, 40.0) * 0.9;',
    '  gl_FragColor = vec4(c, 1.0);',
    '}'
  ].join('\n')
});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(80, 24, 14), skyMat));
scene.fog = new THREE.FogExp2(0x1b2320, 0.018);

// the thing, standing in the opening
(function(){
  var g = new THREE.Group();
  var dark = new THREE.MeshStandardMaterial({ color: 0x080a0e, roughness: 0.95, metalness: 0 });
  var t = new THREE.Mesh(new THREE.CylinderGeometry(0.19, 0.14, 1.0, 8), dark); t.position.y = 1.3; g.add(t);
  var h = new THREE.Mesh(new THREE.SphereGeometry(0.17, 8, 6), dark); h.position.y = 0.82; h.scale.set(1,0.9,0.9); g.add(h);
  var hd = new THREE.Mesh(new THREE.SphereGeometry(0.145, 12, 10), dark); hd.position.y = 1.95; hd.scale.set(0.92,1.18,0.95); g.add(hd);
  for (var s = -1; s <= 1; s += 2){
    var arm = new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.03,1.1,6), dark);
    arm.position.set(0.26*s, 1.28, 0); arm.rotation.z = -0.1*s; g.add(arm);
    var leg = new THREE.Mesh(new THREE.CylinderGeometry(0.065,0.045,0.95,6), dark);
    leg.position.set(0.1*s, 0.4, 0); g.add(leg);
  }
  g.position.set(0.1, 0, -8.9);
  g.rotation.y = 0.04;
  scene.add(g);
})();

var meshes = [];
var lightmaps = {};
var useLM = true;
var DB = new URLSearchParams(location.search).get('d') || 'bake2';
var loader = new THREE.GLTFLoader();

loader.load(DB + '/room.glb', function(gltf){
  scene.add(gltf.scene);
  gltf.scene.traverse(function(o){
    if (!o.isMesh) return;
    meshes.push(o);
    o.receiveShadow = true;
    o.castShadow = true;
    var g = o.geometry;
    if (g.attributes.uv && !g.attributes.uv2) g.setAttribute('uv2', g.attributes.uv);
  });

  // map a mesh to its lightmap: own name first, then its material (joined plant meshes
  // keep the scan's internal names, not the joined object name)
  var MATMAP = { 'fern_02': 'plant_fern', 'grass_medium_01': 'plant_grass', 'shrub_02': 'plant_shrub' };
  var cache = {};
  var pending = meshes.length;

  function textureFor(m, done){
    var keys = [m.name];
    var matName = (m.material && m.material.name) || '';
    if (MATMAP[matName]) keys.push(MATMAP[matName]);
    if (matName) keys.push(matName);
    var i = 0;
    (function next(){
      if (i >= keys.length) { done(null); return; }
      var k = keys[i++];
      if (cache[k]) { done(cache[k]); return; }
      new THREE.TextureLoader().load(DB + '/' + k + '_lm.png', function(t){
        t.encoding = THREE.sRGBEncoding;
        t.anisotropy = renderer.capabilities.getMaxAnisotropy();
        cache[k] = t;
        done(t);
      }, undefined, function(){ next(); });
    })();
  }

  meshes.forEach(function(m){
    textureFor(m, function(t){
      if (t) lightmaps[m.uuid] = t;
      if (--pending === 0) apply();
    });
  });

  function apply(){
    meshes.forEach(function(m){
      var t = lightmaps[m.uuid];
      if (!t) return;
      m.material.lightMap = t;
      m.material.lightMapIntensity = 1.5;
      m.material.needsUpdate = true;
    });
    document.getElementById('load').style.opacity = '0';
    setTimeout(function(){ document.getElementById('load').style.display = 'none'; }, 500);
    window.ROOM = { ready: true, meshes: meshes.length, uv2: meshes.every(function(m){ return !!m.geometry.attributes.uv2; }),
                    applied: meshes.filter(function(m){ return !!m.material.lightMap; }).length,
                    names: meshes.map(function(m){ return m.name + '|' + (m.material && m.material.name); }) };
  }
}, undefined, function(e){
  document.getElementById('load').textContent = 'GLB FAILED';
  console.error(e);
});

document.getElementById('btn').addEventListener('click', function(){
  useLM = !useLM;
  meshes.forEach(function(m){
    m.material.lightMap = useLM ? lightmaps[m.uuid] : null;
    m.material.needsUpdate = true;
  });
  this.textContent = useLM ? 'LIGHTMAP ON' : 'LIGHTMAP OFF';
});

window.addEventListener('resize', function(){
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight, false);
});

(function loop(){ renderer.render(scene, camera); requestAnimationFrame(loop); })();
})();
</script>
</body>
</html>

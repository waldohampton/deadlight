<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>DEADLIGHT - the yard</title>
<style>
  html,body{margin:0;height:100%;background:#04060a;overflow:hidden;touch-action:none;
    font-family:"Cascadia Mono",Consolas,monospace;color:#d8d5c8;-webkit-user-select:none;user-select:none;}
  #v{position:fixed;top:0;left:0;width:100%;height:100%;display:block;}
  #vig{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at 50% 48%,rgba(0,0,0,0) 38%,rgba(0,0,0,.68) 100%);}
  #hud{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .4s;}
  #hud.on{opacity:1;}
  #clock{position:absolute;left:50%;top:18px;transform:translateX(-50%);font-size:24px;letter-spacing:3px;
    color:#e8e4d6;text-shadow:0 0 20px rgba(0,0,0,.9);}
  #clock small{display:block;text-align:center;font-size:9px;letter-spacing:3px;color:#7d8478;margin-top:2px;}
  #best{position:absolute;right:22px;top:20px;font-size:9px;letter-spacing:2px;color:#7d8478;text-align:right;line-height:1.9;}
  #cp{position:absolute;left:22px;top:20px;font-size:9px;letter-spacing:2px;color:#7d8478;line-height:1.9;}
  #cp b{color:#9dffbe;font-weight:normal;}
  #spd{position:absolute;left:22px;top:44px;font-size:9px;letter-spacing:2px;color:#5f665d;}
  #msg{position:absolute;left:0;right:0;bottom:88px;text-align:center;font-size:12px;letter-spacing:4px;
    color:rgba(255,179,71,.9);text-shadow:0 0 18px rgba(255,120,40,.45);}
  #screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;background:rgba(4,6,10,.87);z-index:10;text-align:center;padding:20px;}
  #screen h1{font-size:26px;letter-spacing:8px;font-weight:normal;margin:0 0 6px;}
  #screen h2{font-size:10px;letter-spacing:4px;color:#7d8478;font-weight:normal;margin:0 0 24px;}
  #screen p{font-size:11px;letter-spacing:1.5px;line-height:2.1;color:#9aa093;margin:0 0 22px;max-width:470px;}
  #screen b{color:#ffb347;font-weight:normal;}
  #go{border:1px solid rgba(255,179,71,.5);background:none;color:#ffb347;font:inherit;
    font-size:11px;letter-spacing:4px;padding:14px 34px;cursor:pointer;}
  #go:hover{background:rgba(255,179,71,.08);}
  /* Touch controls. Two thumb zones, nothing on double duty, and every target
     well over the 48 px minimum. Targets sit above env(safe-area-inset-*) so a
     phone with a home bar does not eat them. */
  #stick,#ring{position:fixed;width:118px;height:118px;margin:-59px 0 0 -59px;
    border-radius:50%;pointer-events:none;}
  #stick{left:calc(24px + env(safe-area-inset-left,0px));
    bottom:calc(30px + env(safe-area-inset-bottom,0px));top:auto;margin:0;
    border:1px solid rgba(255,255,255,.20);display:none;
    box-shadow:inset 0 0 30px rgba(0,0,0,.28);}
  #stick.on{display:block;}
  #knob{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;
    border-radius:50%;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.24);}
  #ring{display:none;border:1px solid rgba(255,179,71,.75);background:rgba(255,179,71,.07);}
  #ring.on{display:block;}
  #stick::after{content:attr(data-label);position:absolute;left:0;right:0;bottom:-16px;
    text-align:center;font:inherit;font-size:9px;letter-spacing:3px;color:rgba(255,255,255,.42);}
  #lookhint{position:fixed;right:calc(28px + env(safe-area-inset-right,0px));
    bottom:calc(272px + env(safe-area-inset-bottom,0px));width:92px;height:92px;border-radius:50%;
    border:1px dashed rgba(255,255,255,.16);display:none;pointer-events:none;}
  #lookhint.on{display:block;}
  #lookhint::after{content:attr(data-label);position:absolute;left:0;right:0;bottom:-16px;
    text-align:center;font:inherit;font-size:9px;letter-spacing:3px;color:rgba(255,255,255,.38);}
  #btnJump,#btnAct{position:fixed;border-radius:50%;font:inherit;font-size:11px;letter-spacing:2px;
    color:#ffd7a0;background:rgba(12,10,8,.42);border:1px solid rgba(255,179,71,.55);display:none;
    -webkit-tap-highlight-color:transparent;touch-action:none;user-select:none;cursor:pointer;}
  #btnJump{right:calc(30px + env(safe-area-inset-right,0px));
    bottom:calc(34px + env(safe-area-inset-bottom,0px));width:100px;height:100px;}
  #btnAct{right:calc(34px + env(safe-area-inset-right,0px));
    bottom:calc(156px + env(safe-area-inset-bottom,0px));width:92px;height:92px;
    border-color:rgba(255,255,255,.42);color:#eef2f6;background:rgba(18,22,26,.55);}
  #btnJump.on,#btnAct.on{display:block;}
  #btnJump.act,#btnAct.act{background:rgba(255,179,71,.24);}
  #keys{position:absolute;left:50%;transform:translateX(-50%);
    bottom:14px;padding:6px 13px;border-radius:3px;background:rgba(8,8,10,.55);
    font:inherit;font-size:12px;letter-spacing:1.3px;white-space:nowrap;
    color:rgba(255,244,230,.90);display:none;}
  #keys.on{display:block;}
  #keys b{color:rgba(255,214,150,.78);font-weight:400;}
</style>
</head>
<body>
<canvas id="v"></canvas>
<div id="vig"></div>

<div id="hud">
  <div id="clock">0.00<small>RUN</small></div>
  <div id="cp">MARKER <b>START</b></div>
  <div id="spd">0.0 M/S</div>
  <div id="best"></div>
  <div id="msg"></div>
  <div id="keys"><b>W A S D</b> MOVE · <b>SHIFT</b> RUN · <b>SPACE</b> JUMP · <b>E</b> USE · <b>R</b> RESET</div>
</div>

<div id="stick" data-label="MOVE"><div id="knob"></div></div>
<div id="ring"></div>
<div id="lookhint" data-label="LOOK"></div>
<button id="btnJump">JUMP</button>
<button id="btnAct">GET IN</button>

<div id="screen">
  <h1>DEADLIGHT</h1>
  <h2 id="scrLevel">THE LONG ROAD</h2>
  <p id="scrCopy">
    Five gates, one loop out of the yard and back. It is a road, not a track: hold
    the throttle, aim at the arches, and do not lift for the corners.
  </p>
  <p id="scrKeys"></p>
  <button id="go">START RUN</button>
</div>

<script src="three.min.js"></script>
<script src="GLTFLoader.js"></script>
<script>
(function(){
'use strict';
var canvas = document.getElementById('v');
var renderer = new THREE.WebGLRenderer({canvas:canvas, antialias:true, powerPreference:'high-performance'});
var IS_TOUCH = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
// which input the player is actually using. Touch pads and the keyboard legend
// never both show. This starts false on purpose: plenty of desktops report
// ontouchstart, so capability is not usage. The first real touch flips it.
var TOUCH = { hand: false, using: false };
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, IS_TOUCH ? 1.5 : 2));
renderer.setSize(window.innerWidth, window.innerHeight, false);
renderer.outputEncoding = THREE.LinearEncoding;
renderer.toneMapping = THREE.NoToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

var scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1520);
// exponential fog ate everything past 150 m, so the mesas came out the same
// colour as the haze. Linear fog keeps the near field clear and lands the haze
// at a distance that is chosen rather than implied.
scene.fog = new THREE.Fog(0x8f8a76, 90, 620);

var camera = new THREE.PerspectiveCamera(64, window.innerWidth/window.innerHeight, 0.12, 1400);
camera.rotation.order = 'YXZ';

var torch = new THREE.SpotLight(0xffe2bc, 2.4, 30, 0.66, 0.85, 1.2);
torch.position.set(0.1, -0.06, 0.1);
torch.target.position.set(0, -0.22, -6);
torch.castShadow = true;
torch.shadow.mapSize.set(512, 512);
torch.shadow.bias = -0.0015;
torch.shadow.normalBias = 0.04;
camera.add(torch); camera.add(torch.target); scene.add(camera);
scene.add(new THREE.HemisphereLight(0xffb27a, 0x2a1d18, 0.38));

// ---------------------------------------------------------------- sunset
// The yard is baked at night, so the bake is treated as ambient occlusion and
// the colour comes from a low sun, a warm dome and a grade. Re-baking the
// lightmaps is the proper fix if the shadows ever need to agree with the sun.
var SUN_DIR = new THREE.Vector3(0.62, 0.248, -1).normalize();
var skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: {
    uTop: {value: new THREE.Color(0x172440)},
    uMid: {value: new THREE.Color(0x7d4453)},
    uHor: {value: new THREE.Color(0xc26a36)},
    uSun: {value: SUN_DIR.clone()},
    uSunCol: {value: new THREE.Color(0xffd9a6)},
    uSky: {value: null},
    uSkyOn: {value: 0},
    // Measured off sky_sunset.jpg, not guessed. The photographed sun sits at
    // u 0.5862, and SUN_DIR's azimuth is u 0.3383, so the dome is turned by the
    // difference and the sun in the photograph lands where the light comes
    // from. The elevation is already close (11.9 deg against 11.9), which is why
    // SUN_DIR's y went from 0.20 to 0.248: that is the photo's sun height.
    uSkyYaw: {value: 0.2479},
    uSkyGain: {value: 1.0}
  },
  vertexShader: [
    'varying vec3 vDir;',
    'void main(){',
    // world direction, not object direction. The dome is a child of the camera,
    // so object space turns with the view: a photographed sky sampled that way
    // swings around as the player looks, and its sun stops agreeing with the
    // light.
    '  vDir = normalize((modelMatrix * vec4(position, 1.0)).xyz - cameraPosition);',
    '  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);',
    '}'
  ].join('\n'),
  fragmentShader: [
    'varying vec3 vDir; uniform vec3 uTop, uMid, uHor, uSun, uSunCol;',
    'uniform sampler2D uSky; uniform float uSkyOn, uSkyYaw, uSkyGain;',
    'void main(){',
    '  vec3 d = normalize(vDir);',
    '  float h = clamp(d.y * 1.25 + 0.06, 0.0, 1.0);',
    '  vec3 c = mix(uHor, uMid, smoothstep(0.0, 0.34, h));',
    '  c = mix(c, uTop, smoothstep(0.26, 0.90, h));',
    // the photograph, when it has arrived. Until then the mixed gradient above
    // is the sky, so the dome is never black while the jpeg loads.
    '  if (uSkyOn > 0.5){',
    '    vec2 uv = vec2(atan(d.z, d.x) * 0.15915494 + 0.5 + uSkyYaw,',
    '                   asin(clamp(d.y, -1.0, 1.0)) * 0.31830989 + 0.5);',
    '    vec3 p = texture2D(uSky, vec2(fract(uv.x), uv.y)).rgb;',
    // the jpeg is LDR, so it is decoded to linear by hand (pow 2.2) and then
    // graded by the same film pass as everything else rather than bypassing it
    '    c = pow(p, vec3(2.2)) * uSkyGain;',
    '  }',
    '  float s = max(dot(d, normalize(uSun)), 0.0);',
    '  c += uSunCol * pow(s, 900.0) * 2.0;',
    '  c += uSunCol * pow(s, 6.0) * 0.05;',
    '  gl_FragColor = vec4(c, 1.0);',
    '}'
  ].join('\n')
});
var sky = new THREE.Mesh(new THREE.SphereGeometry(900, 32, 20), skyMat);
sky.frustumCulled = false;
// a child of the camera, so it is centred on the eye no matter what the player
// does. Parented to the scene it stayed over the yard, and 300 m out you were
// standing outside it looking at the dome's edge.
camera.add(sky);
sky.position.set(0, 0, 0);

// The photographed sky. Loaded after the gradient is already live, so a failed
// fetch leaves a sky instead of a black dome. 2:1 equirect, 52 KB at 2048 x
// 1024, which is plenty for a dome that fills the top third of the frame.
new THREE.TextureLoader().load('models/tex/sky_sunset.jpg', function(t){
  t.encoding = THREE.LinearEncoding;
  t.wrapS = THREE.RepeatWrapping;
  t.wrapT = THREE.ClampToEdgeWrapping;
  t.minFilter = THREE.LinearMipmapLinearFilter;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  skyMat.uniforms.uSky.value = t;
  skyMat.uniforms.uSkyOn.value = 1;
  window.SKY_READY = true;
}, undefined, function(e){ console.warn('sky failed', e); });

// The sky is the ambient source in spirit, but not through PMREM. In this three
// build a prefiltered cube handed to a material renders that surface black: it
// is what turned the car into a hole, and setting it scene wide blacked out the
// triplanar yard shaders too. A cheap emissive tint on the car stands in for sky
// bounce, costs nothing, and cannot break a shader.

var sun = new THREE.DirectionalLight(0xffa858, 0.88);
sun.position.copy(SUN_DIR).multiplyScalar(150);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
// tighter box on the same 2k map: twice the texel density for no extra cost,
// so the contact shadow under the car lands where it should
sun.shadow.camera.left = -34; sun.shadow.camera.right = 34;
sun.shadow.camera.top = 34; sun.shadow.camera.bottom = -34;
sun.shadow.camera.near = 1; sun.shadow.camera.far = 320;
sun.shadow.bias = -0.0008;
sun.shadow.normalBias = 0.05;
scene.add(sun); scene.add(sun.target);

// keep the shadow box on whoever is playing, so it is never left behind
function focusSun(){
  // called once at load, before CAR and P exist, so bail until there is
  // somebody to follow
  var f = (MODE === 'car' && CAR) ? CAR.pos : (P ? P.pos : null);
  if (!f) return;
  sun.position.set(f.x + SUN_DIR.x * 150, SUN_DIR.y * 150, f.z + SUN_DIR.z * 150);
  sun.target.position.set(f.x, 0, f.z);
  sun.target.updateMatrixWorld();
}
focusSun();

var camFill = new THREE.PointLight(0xe0b795, 0.40, 9, 2);
camFill.position.set(0, 0.2, 0.6);
camera.add(camFill);

// open ground past the yard boundary. The baked floor is 70 m square, so
// without this the world ends on a straight line. Fog swallows the edge of
// this 240 m disc long before you can reach it.
var apronMat = new THREE.MeshStandardMaterial({color:0x7d7368, roughness:0.97, metalness:0.0});
var apron = new THREE.Mesh(new THREE.CircleGeometry(520, 64), apronMat);
apron.rotation.x = -Math.PI / 2;
apron.position.y = -0.05;
apron.receiveShadow = true;
scene.add(apron);

// ---------------------------------------------------------------- course geometry
// a box is a solid you can stand on: x/z centre, half extents, top height, depth
var boxes = [];
var padSolids = [];
var STEP_MAT  = new THREE.MeshStandardMaterial({color:0x1a1d21, roughness:0.62, metalness:0.55});
var EDGE_MAT  = new THREE.MeshStandardMaterial({color:0x8a6a1e, roughness:0.5, metalness:0.2,
                                                emissive:0x120a00, emissiveIntensity:1});
var PANEL_MAT = new THREE.MeshStandardMaterial({color:0x0f1215, roughness:0.85, metalness:0.2});
var ramps = [];    // axis aligned slopes the player runs up without breaking stride

function addBox(x0, x1, z0, z1, y0, y1, v){
  boxes.push({x0:x0, x1:x1, z0:z0, z1:z1, y0:y0, y1:y1, v:v || 'on'});
}

// a slope: y0 at the x0/z0 end, y1 at the x1/z1 end. The slab hangs `thick`
// under the walking surface, so feet stand on exactly the y0 -> y1 line.
function ramp(name, x0, x1, z0, z1, y0, y1, thick){
  thick = thick || 0.24;
  // normalise so the slope always rises toward +x or +z along the axis it runs
  var alongX = Math.abs(x1 - x0) >= Math.abs(z1 - z0);
  if (alongX){ if (x1 < x0){ var tx = x0; x0 = x1; x1 = tx; var tyx = y0; y0 = y1; y1 = tyx; } }
  else       { if (z1 < z0){ var tz = z0; z0 = z1; z1 = tz; var tyz = y0; y0 = y1; y1 = tyz; } }
  var run  = alongX ? (x1 - x0) : (z1 - z0);
  var ang  = Math.atan2(y1 - y0, run);
  var len  = Math.sqrt(run*run + (y1-y0)*(y1-y0));
  var half = thick / 2;
  var g = new THREE.Group();
  var body = new THREE.Mesh(
    alongX ? new THREE.BoxGeometry(len, thick, z1 - z0)
           : new THREE.BoxGeometry(x1 - x0, thick, len), STEP_MAT);
  body.castShadow = true; body.receiveShadow = true; body.name = name;
  g.add(body);
  var lip, s;
  for (s = -1; s <= 1; s += 2){
    if (alongX){
      lip = new THREE.Mesh(new THREE.BoxGeometry(len, 0.05, 0.07), EDGE_MAT);
      lip.position.set(0, half + 0.02, s*((z1 - z0)/2 - 0.035));
    } else {
      lip = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.05, len), EDGE_MAT);
      lip.position.set(s*((x1 - x0)/2 - 0.035), half + 0.02, 0);
    }
    g.add(lip);
  }
  // place the slab so its top face lies on the y0 -> y1 line
  if (alongX){
    g.rotation.z = ang;
    g.position.set((x0+x1)/2 + Math.sin(ang)*half, (y0+y1)/2 - Math.cos(ang)*half, (z0+z1)/2);
  } else {
    g.rotation.x = -ang;
    g.position.set((x0+x1)/2, (y0+y1)/2 - Math.cos(ang)*half, (z0+z1)/2 + Math.sin(ang)*half);
  }
  scene.add(g);
  padSolids.push(body);
  ramps.push({x0:x0, x1:x1, z0:z0, z1:z1, y0:y0, y1:y1, axis:alongX ? 'x' : 'z', name:name});
  return body;
}

// a leg, so built structures read as built and not hung in the air
function post(x, z, y0, y1, r){
  r = r || 0.07;
  var m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, y1 - y0, 8), STEP_MAT);
  m.position.set(x, (y0 + y1)/2, z);
  m.castShadow = true;
  scene.add(m);
  padSolids.push(m);
  return m;
}

function pad(name, x, z, hw, hd, top, thick, glow){
  thick = thick || 0.26;
  var g = new THREE.Group();
  var body = new THREE.Mesh(new THREE.BoxGeometry(hw*2, thick, hd*2), STEP_MAT);
  body.position.y = top - thick/2;
  body.castShadow = true; body.receiveShadow = true; body.name = name;
  g.add(body);
  // lit edge strip so the landing reads in the dark
  var edge = new THREE.Mesh(new THREE.BoxGeometry(hw*2 + 0.06, 0.045, hd*2 + 0.06), EDGE_MAT);
  edge.position.y = top + 0.012;
  g.add(edge);
  if (glow){
    var gl = new THREE.PointLight(0xffc070, glow, 5.0, 2);
    gl.position.set(0, top + 0.4, 0);
    g.add(gl);
  }
  g.position.set(x, 0, z);
  scene.add(g);
  padSolids.push(body, edge);
  boxes.push({x0:x-hw, x1:x+hw, z0:z-hd, z1:z+hd, y0:top-thick, y1:top});
  return g;
}

// ---------------------------------------------------------------- the line
// The route is built onto the baked yard instead of floating over it: floor,
// the yellow rail, the pipe rack, one long ramp to the gantry, the gantry
// deck, the pipe run west and a scaffold climb up the tank. Every coordinate
// below is measured off the loaded glb, so feet land on the real surfaces.

// 1. floor. The apron is the only new thing at ground level, and it is a step,
//    not a platform: it catches the light so the start reads from the camera.
pad('apron', 0, 10.5, 2.2, 1.6, 0.10, 0.20, 0.34);

// 2. the rail line. The bake already has a curb (top 0.32) and a three bar
//    yellow rail (top 1.28) across x -8.5..8.5 at z -2.2. The curb is a step,
//    the rail is a vault.
addBox(-13.0, 13.0, -2.55, -1.85, 0.00, 0.32, 'on');
addBox( -8.5,  8.5, -2.26, -1.90, 0.32, 1.28, 'over');

// 3. the pipe rack. Solid at its measured heights, so the yard's own pipes
//    become the staircase: vault pipe_a (1.69), skim pipe_b (0.97), vault the
//    catwalk (2.26). Then the catwalk runs the length of the yard to the tank.
addBox(-17, 17, -7.34, -6.66, 1.01, 1.69, 'on');   // pipe_a
addBox(-17, 17, -8.12, -7.68, 0.53, 0.97, 'on');   // pipe_b
addBox(-17, 17, -8.76, -8.44, 1.94, 2.26, 'on');   // pipe_c
pad('catwalk', -6.6, -8.6, 8.4, 0.55, 2.26, 0.14, 0.26);

// 4. the ramp to the gantry, off the back of the rail on the right.
// 3.2 m wide: at 2.2 m the car had 12 cm either side and wedged on the corner.
ramp('ramp_up', 11.0, 14.2, -2.60, -9.30, 0.06, 4.26);

// 5. the gantry deck sits at 4.26; extend it east so the ramp arrives on it
pad('deck_e', 12.6, -9.9, 2.0, 0.8, 4.26, 0.22, 0.26);

// 6. the drop: a lit shelf at pipe_c height hanging off the gantry's north side
pad('shelf', 9.4, -7.6, 1.4, 1.5, 2.26, 0.18, 0.24);

// 6. the tank cap is a real surface, and the high point of the yard
addBox(-13.55, -7.45, -15.05, -8.95, 6.81, 6.99, 'on');

// 7. the climb: one long flight up the tank's west face, pipe height to cap
//    height in a single run, then a step east onto the cap. No stopping.
pad ('tw0',  -15.4,  -8.55, 0.90, 0.65, 2.26, 0.18, 0.24);
ramp('tw_up', -16.2, -14.6, -9.20, -17.00, 2.26, 6.99);
pad ('tw_top', -14.85, -15.95, 1.45, 1.05, 6.99, 0.18, 0.26);

// the second way in, from the yard floor, so a fall near the tank is not a
// dead end: you can always walk back up to the climb
ramp('tank_in', -17.6, -15.9, -13.20, -8.60, 0.06, 2.26);

// legs, so the scaffold reads as built and not hung in the air
post(-15.4,  -8.55, 0, 2.17);
post(-15.4, -10.60, 0, 3.11);
post(-16.1, -13.10, 0, 4.63);
post(-15.4, -15.60, 0, 6.14);
post(-13.9, -16.60, 0, 6.75);

// ramp guards: thin solid walls down the sides of every ramp that starts at
// ground level. Without them you can enter a ramp sideways and end up inside
// the wedge with the surface above you, which is what the first autopilot lap
// did, three metres short of the mouth.
(function(){
  var t = 0.12;
  ramps.forEach(function(r){
    if (Math.min(r.y0, r.y1) > 0.6) return;      // scaffold ramps are not drivable
    var top = Math.max(r.y0, r.y1) + 0.30;
    var x0 = Math.min(r.x0, r.x1), x1 = Math.max(r.x0, r.x1);
    var z0 = Math.min(r.z0, r.z1), z1 = Math.max(r.z0, r.z1);
    if (r.axis === 'x'){
      boxes.push({x0:x0, x1:x1, z0:z0 - t, z1:z0, y0:0, y1:top});
      boxes.push({x0:x0, x1:x1, z0:z1, z1:z1 + t, y0:0, y1:top});
    } else {
      boxes.push({x0:x0 - t, x1:x0, z0:z0, z1:z1, y0:0, y1:top});
      boxes.push({x0:x1, x1:x1 + t, z0:z0, z1:z1, y0:0, y1:top});
    }
  });
})();

// ---------------------------------------------------------------- levels
// A level is one place, one mode and one route. Some levels are walking, some
// are driving. Everything downstream (reset, markers, finish, the HUD) asks the
// level rather than hard coding a route, so adding the next one is data only.

var TRACK_MATS = [];          // road materials, textured once the scans load
var LEVELS = {};              // level id -> { mode, route, finish, spawn }

function buildDesertCircuit(){
  // A loop out of the yard to the south, across open ground, and back. The
  // shape is quoted in the concept art: one long road, poles on one side,
  // mesas on the horizon, nothing to hit.
  var spine = [
    [   6, 30], [   0, 100], [ -28, 165], [ -66, 225], [ -60, 305],
    [  -6, 352], [  64, 360], [ 128, 332], [ 160, 262], [ 162, 176],
    [ 132, 106], [  84,  56], [  42,  30], [  14, 26]
  ];
  var curve = new THREE.CatmullRomCurve3(
    spine.map(function(p){ return new THREE.Vector3(p[0], 0, p[1]); }), true, 'catmullrom', 0.5);

  var SEG = 420;
  var pts = curve.getPoints(SEG);
  var g = new THREE.Group();
  g.name = 'circuit';

  // cumulative distance, so the road texture tiles with the ground speed
  var dist = [0];
  for (var i = 1; i < pts.length; i++) dist.push(dist[i-1] + pts[i].distanceTo(pts[i-1]));
  var total = dist[dist.length-1] + pts[pts.length-1].distanceTo(pts[0]);

  function ribbon(halfW, y, uRep){
    var pos = [], uv = [], idx = [];
    for (var i = 0; i < pts.length; i++){
      var p = pts[i], q = pts[(i+1) % pts.length];
      var tx = q.x - p.x, tz = q.z - p.z, L = Math.hypot(tx, tz) || 1;
      var sx = -tz / L, sz = tx / L;                 // left of travel
      pos.push(p.x + sx*halfW, y, p.z + sz*halfW);
      pos.push(p.x - sx*halfW, y, p.z - sz*halfW);
      uv.push(0, dist[i]/4, uRep, dist[i]/4);
      if (i > 0){
        var a = (i-1)*2, b = a+1, c2 = i*2, d = c2+1;
        idx.push(a, c2, b, b, c2, d);
      }
    }
    var geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
    geo.setIndex(idx);
    // flat ground, so every normal is up. Winding on a ribbon is easy to get
    // backwards and a road lit from underneath looks like a hole.
    var nrm = new Float32Array(pos.length);
    for (var k = 1; k < nrm.length; k += 3) nrm[k] = 1;
    geo.setAttribute('normal', new THREE.BufferAttribute(nrm, 3));
    return geo;
  }

  var shoulderMat = new THREE.MeshStandardMaterial({color:0x8a7355, roughness:0.98, metalness:0.0});
  var roadMat     = new THREE.MeshStandardMaterial({color:0x9a9a96, roughness:0.95, metalness:0.0});
  TRACK_MATS.push({mat: shoulderMat, kind:'shoulder'}, {mat: roadMat, kind:'road'});

  var shoulder = new THREE.Mesh(ribbon(6.8, 0.01, 3.4), shoulderMat);
  shoulder.receiveShadow = true;
  g.add(shoulder);
  var road = new THREE.Mesh(ribbon(4.2, 0.03, 2.0), roadMat);
  road.receiveShadow = true;
  g.add(road);

  // centre dashes, every 14 m, 3 m long, faded
  (function(){
    var pos = [], idx = [], n = 0;
    var step = 14;
    for (var d = 20; d < total - 10; d += step){
      var u = d / total;
      var p0 = curve.getPointAt(Math.max(0, Math.min(0.9999, u)));
      var p1 = curve.getPointAt(Math.max(0, Math.min(0.9999, (d + 3) / total)));
      var tx = p1.x - p0.x, tz = p1.z - p0.z, L = Math.hypot(tx, tz) || 1;
      var sx = -tz / L * 0.14, sz = tx / L * 0.14;
      pos.push(p0.x + sx, 0.05, p0.z + sz,  p0.x - sx, 0.05, p0.z - sz,
               p1.x + sx, 0.05, p1.z + sz,  p1.x - sx, 0.05, p1.z - sz);
      idx.push(n, n+2, n+1, n+1, n+2, n+3);
      n += 4;
    }
    var geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    geo.setIndex(idx);
    var nrm = new Float32Array(pos.length);
    for (var k = 1; k < nrm.length; k += 3) nrm[k] = 1;
    geo.setAttribute('normal', new THREE.BufferAttribute(nrm, 3));
    var m = new THREE.MeshStandardMaterial({color:0xbcb49c, roughness:0.88, metalness:0.0});
    var mesh = new THREE.Mesh(geo, m);
    g.add(mesh);
  })();

  // poles and wires, one side of the road, every 45 m
  (function(){
    var poleMat = new THREE.MeshStandardMaterial({color:0x4a3a2a, roughness:0.92, metalness:0.0});
    var poleGeo = new THREE.BoxGeometry(0.20, 9.2, 0.20);
    var armGeo  = new THREE.BoxGeometry(2.3, 0.13, 0.13);
    var tops = [];
    for (var d = 30; d < total - 5; d += 45){
      var u = d / total;
      var p = curve.getPointAt(Math.min(0.9999, u));
      var p2 = curve.getPointAt(Math.min(0.9999, u + 0.004));
      var tx = p2.x - p.x, tz = p2.z - p.z, L = Math.hypot(tx, tz) || 1;
      var sx = -tz / L, sz = tx / L;
      var px = p.x + sx * 12.5, pz = p.z + sz * 12.5;
      var pole = new THREE.Mesh(poleGeo, poleMat);
      pole.position.set(px, 4.6, pz);
      // no shadow: thirty casters outside the old shadow box, and a pole on
      // the horizon contributes nothing you can see
      pole.castShadow = false;
      g.add(pole);
      var arm = new THREE.Mesh(armGeo, poleMat);
      arm.position.set(px, 8.6, pz);
      arm.rotation.y = Math.atan2(tx, tz);
      g.add(arm);
      tops.push(new THREE.Vector3(px, 8.55, pz));
    }
    // sagging wire between consecutive poles
    var wmat = new THREE.LineBasicMaterial({color:0x1a1614});
    for (var i = 1; i < tops.length; i++){
      var a = tops[i-1], b = tops[i];
      if (a.distanceTo(b) > 60) continue;
      var verts = [];
      for (var s = 0; s <= 10; s++){
        var t = s / 10;
        verts.push(
          a.x + (b.x - a.x) * t,
          a.y + (b.y - a.y) * t - Math.sin(t * Math.PI) * 1.1,
          a.z + (b.z - a.z) * t);
      }
      var geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
      g.add(new THREE.Line(geo, wmat));
    }
  })();

  // mesas on the horizon, eroded rather than extruded: a 6 sided prism reads as
  // a pyramid the second you look at it. Cheap noise on a 12 sided body gives a
  // silhouette that survives being looked at.
  (function(){
    var mat = new THREE.MeshStandardMaterial({color:0x553726, roughness:0.96, metalness:0.0, flatShading:true});
    var spots = [[-250, 150, 70, 62], [-170, -120, 90, 54], [150, -180, 100, 68],
                 [260, 120, 80, 58], [230, 300, 95, 60], [-230, 320, 75, 48],
                 [-30, 400, 110, 66], [330, 240, 70, 52]];
    spots.forEach(function(s, si){
      var geo = new THREE.CylinderGeometry(s[2]*0.52, s[2], s[3], 12, 4);
      var pa = geo.attributes.position;
      for (var vi = 0; vi < pa.count; vi++){
        var vx = pa.getX(vi), vy = pa.getY(vi), vz = pa.getZ(vi);
        var t = (vy + s[3]/2) / s[3];
        var n = Math.sin(vx*0.09 + vz*0.07 + si) * Math.cos(vz*0.05 - vx*0.03);
        var f = 1 + 0.16*n*(1 - t*0.55);
        pa.setX(vi, vx*f); pa.setZ(vi, vz*f);
      }
      geo.computeVertexNormals();
      var m = new THREE.Mesh(geo, mat);
      m.position.set(s[0], s[3]/2 - 5, s[1]);
      m.rotation.y = si * 0.7;
      g.add(m);
    });
  })();

  // ground clutter. Rocks and scrub as two instanced draws, so thousands of
  // them cost two draw calls and no extra state changes. This is most of what
  // separates "a road on a plane" from "a road through a desert".
  (function(){
    var seed = 20261112;
    function rnd(){ seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; }

    var rockGeo = new THREE.IcosahedronGeometry(1, 0);
    var rockMat = new THREE.MeshStandardMaterial({color:0x54453a, roughness:0.98,
                                                  metalness:0.0, flatShading:true});
    var ROCKS = 900;
    var rocks = new THREE.InstancedMesh(rockGeo, rockMat, ROCKS);
    rocks.receiveShadow = true;
    var mtx = new THREE.Matrix4(), q = new THREE.Quaternion(), eu = new THREE.Euler();
    var pos = new THREE.Vector3(), scl = new THREE.Vector3();
    for (var i = 0; i < ROCKS; i++){
      var pt = pts[Math.floor(rnd() * pts.length)];
      var ang = rnd() * Math.PI * 2, rad = 11 + rnd() * rnd() * 150;
      var sc = 0.18 + rnd() * rnd() * 2.4;
      pos.set(pt.x + Math.cos(ang) * rad, sc * 0.34 - 0.06, pt.z + Math.sin(ang) * rad);
      eu.set(rnd() * 0.5, rnd() * 6.283, rnd() * 0.5);
      q.setFromEuler(eu);
      scl.set(sc, sc * (0.45 + rnd() * 0.7), sc * (0.8 + rnd() * 0.5));
      rocks.setMatrixAt(i, mtx.compose(pos, q, scl));
    }
    rocks.instanceMatrix.needsUpdate = true;
    g.add(rocks);

    // scrub: five sided tufts, dark and low. Reads as vegetation at distance
    // without a single alpha texture or a shadow pass.
    var bushGeo = new THREE.ConeGeometry(0.62, 0.85, 5, 1);
    var bushMat = new THREE.MeshStandardMaterial({color:0x3f4029, roughness:1.0,
                                                  metalness:0.0, flatShading:true});
    var BUSH = 1800;
    var bush = new THREE.InstancedMesh(bushGeo, bushMat, BUSH);
    for (var j = 0; j < BUSH; j++){
      var bt = pts[Math.floor(rnd() * pts.length)];
      var ba = rnd() * Math.PI * 2, br = 10 + rnd() * rnd() * 130;
      var bs = 0.5 + rnd() * 1.1;
      pos.set(bt.x + Math.cos(ba) * br, bs * 0.42 - 0.05, bt.z + Math.sin(ba) * br);
      eu.set(0, rnd() * 6.283, 0);
      q.setFromEuler(eu);
      scl.set(bs, bs * (0.7 + rnd() * 0.8), bs);
      bush.setMatrixAt(j, mtx.compose(pos, q, scl));
    }
    bush.instanceMatrix.needsUpdate = true;
    g.add(bush);
  })();

  scene.add(g);

  // gates along the loop, placed by distance so they sit on the road
  var rings = [];
  [0.14, 0.31, 0.48, 0.65, 0.82].forEach(function(u, i){
    var p = curve.getPointAt(u);
    var p2 = curve.getPointAt(Math.min(0.9999, u + 0.004));
    rings.push({ x:+p.x.toFixed(2), y:0.03, z:+p.z.toFixed(2),
                 label:'GATE ' + (i+1), yaw: Math.atan2(p2.x - p.x, p2.z - p.z) });
  });
  return rings;
}

var DESERT_GATES = buildDesertCircuit();

LEVELS.desert = {

  route: [{x:6, y:0.02, z:22, label:'START', yaw:Math.PI}].concat(DESERT_GATES),
  // the finish gets a yaw too, so it builds as a gate across the road instead

  finish: {x:6, y:0.0, z:22, yaw:Math.PI}
};

})();

function routeList(){ return LEVEL.route; }
function finishPoint(){ return LEVEL.finish; }

// markers for the current level. The car markers need to be seen at 60 km/h.
var MARKER_GROUP = new THREE.Group();
scene.add(MARKER_GROUP);
(function(){
  // painted, not glowing: an unlit 0xffb038 ring sits above the bloom threshold
  // and smears across the frame at sunset. This is bright enough to find and
  // dim enough to stay a marking on the floor.
  var ringMat = new THREE.MeshStandardMaterial({color:0x3a2a10, emissive:0xd08a28,
                                                emissiveIntensity:0.55, roughness:0.55, metalness:0.1});
  routeList().slice(1).concat([finishPoint()]).forEach(function(c){
    // driving levels get a gate you can aim at: two posts and a beam standing
    // over the road. A flat ring on the ground reads as a glowing halo floating
    // in the air from a chase camera, which is what looked like stray lights.
    if (LEVEL.mode === 'car' && c.yaw !== undefined){
      var px = Math.cos(c.yaw), pz = -Math.sin(c.yaw);   // across the road
      var ARCH = {color:0x2c2214, emissive:0xffa63a, emissiveIntensity:0.85,
                  roughness:0.5, metalness:0.1};
      var archMat = new THREE.MeshStandardMaterial(ARCH);
      var postGeo = new THREE.BoxGeometry(0.42, 7.4, 0.42);
      [-1, 1].forEach(function(s){
        var post = new THREE.Mesh(postGeo, archMat);
        post.position.set(c.x + px * 6.4 * s, 3.7, c.z + pz * 6.4 * s);
        MARKER_GROUP.add(post);
      });
      var beam = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.46, 13.2), archMat);
      beam.position.set(c.x, 7.2, c.z);
      beam.rotation.y = Math.atan2(px, pz);
      MARKER_GROUP.add(beam);
      // a thin line on the tarmac so you can see the trigger point
      var lick = new THREE.Mesh(new THREE.PlaneGeometry(12.6, 0.34),
                                new THREE.MeshStandardMaterial({color:0x2a2014, emissive:0xc07a2a,
                                  emissiveIntensity:0.22, roughness:0.85}));
      lick.rotation.x = -Math.PI/2; lick.rotation.z = -c.yaw;
      lick.position.set(c.x, 0.06, c.z);
      MARKER_GROUP.add(lick);
      return;
    }
    var r = new THREE.Mesh(new THREE.TorusGeometry(3.4, 0.09, 6, 30), ringMat);
    r.rotation.x = -Math.PI/2;
    r.position.set(c.x, (c.y || 0) + 0.07, c.z);
    MARKER_GROUP.add(r);
    // no point light per ring: six of them swept the road as you passed and
    // read as stray lights flickering. The ring is emissive, that is enough.
  });
})();

// ---------------------------------------------------------------- the car
// A 1979 Calder Arrow 305, the dish on the roof. Arcade physics: a bicycle
// model for the heading, two collision circles, four ground samples so it
// sits on a ramp instead of floating over it.
var CAR = {
  pos: new THREE.Vector3(5.6, 0, 12.6),
  yaw: 0, vel: new THREE.Vector3(), vy: 0,
  steer: 0, spin: 0, spinLock: 0, grounded: true,

};
var CARTUNE = {

  grip: 7.5, gripHand: 1.5, handDecel: 9.0,
  steerMax: 0.60, steerRate: 3.6, steerBack: 6.0,
  wheelbase: 2.55, track: 1.56,
  radius: 0.95, halfLen: 1.15, height: 1.12
};
var MODE = 'foot';

(function(){
  var bodyMat = new THREE.MeshStandardMaterial({color:0x1f2228, roughness:0.58, metalness:0.35});
  var trimMat = new THREE.MeshStandardMaterial({color:0x2a2e34, roughness:0.48, metalness:0.60});
  var glassMat= new THREE.MeshStandardMaterial({color:0x0a0f12, roughness:0.22, metalness:0.80});
  var lampMat = new THREE.MeshBasicMaterial({color:0xffd9a0});
  var tailMat = new THREE.MeshBasicMaterial({color:0xff3a1a});
  var rimMat  = new THREE.MeshStandardMaterial({color:0x33373d, roughness:0.45, metalness:0.80});
  var cabinMat= new THREE.MeshStandardMaterial({color:0x3b4048, roughness:0.50, metalness:0.40});
  var dishMat = new THREE.MeshStandardMaterial({color:0x767c85, roughness:0.38, metalness:0.85});
  var sillMat = new THREE.MeshStandardMaterial({color:0x8a6a1e, roughness:0.45, metalness:0.2,
                                                emissive:0x6a4a08, emissiveIntensity:1.6});

  var g = new THREE.Group();
  g.rotation.order = 'YXZ';
  // vis holds the body. The boxes below are a fallback until the Blender model
  // loads, then they are thrown away and the GLB takes their place.
  var vis = new THREE.Group();
  g.add(vis);

  function part(geo, mat, x, y, z){
    var m = new THREE.Mesh(geo, mat);
    m.position.set(x, y, z);
    m.castShadow = true;
    vis.add(m);
    return m;
  }
  var B = function(w,h,d){ return new THREE.BoxGeometry(w,h,d); };

  // body: long rear deck, low nose, so the profile reads as a wedge
  part(B(1.86, 0.46, 3.30), bodyMat, 0, 0.60,  0.45);   // main body
  part(B(1.80, 0.30, 1.35), bodyMat, 0, 0.52, -1.60);   // nose
  part(B(1.70, 0.16, 0.90), bodyMat, 0, 0.77, -1.95);   // hood lip
  part(B(1.62, 0.42, 1.55), cabinMat, 0, 1.02,  0.10);   // cabin
  part(B(1.50, 0.50, 0.07), glassMat, 0, 0.98, -0.70).rotation.x = -0.52;  // windshield
  part(B(1.46, 0.42, 0.07), glassMat, 0, 1.00,  0.92).rotation.x =  0.46;  // rear glass
  part(B(1.86, 0.22, 0.24), bodyMat, 0, 0.70,  2.14);   // tail panel
  part(B(0.90, 0.05, 3.90), trimMat, 0, 0.86,  0);      // roof line shadow

  // sills and side lamps in the same amber as the course, so it reads at night
  part(B(0.07, 0.07, 2.70), sillMat, -0.94, 0.44, 0.20);
  part(B(0.07, 0.07, 2.70), sillMat,  0.94, 0.44, 0.20);

  // lights
  part(B(0.44, 0.13, 0.06), lampMat, -0.60, 0.62, -2.26);
  part(B(0.44, 0.13, 0.06), lampMat,  0.60, 0.62, -2.26);
  part(B(0.52, 0.10, 0.06), tailMat, -0.58, 0.72,  2.27);
  part(B(0.52, 0.10, 0.06), tailMat,  0.58, 0.72,  2.27);

  var beam = new THREE.SpotLight(0xffe9c4, 7.0, 60, 0.72, 0.60, 0.85);
  beam.position.set(0, 0.70, -1.90);
  beam.target.position.set(0, 0.10, -20);
  beam.castShadow = true;
  beam.shadow.mapSize.set(512, 512);
  beam.shadow.bias = -0.0012;
  g.add(beam); g.add(beam.target);
  CAR.headlights = beam;

  // a cool fill that travels with the car. Without it the body is a silhouette
  // against the yard and nothing about the shape reads at night.
  // a black car under a low sun is a hole unless something lifts it. This is a
  // warm fill from above and behind, roughly where the sky would bounce off the
  // ground behind the car, so the body reads as paint instead of a silhouette.
  // It travels with the car (child of the car group) so there is no cost to it.
  var chaseFill = new THREE.PointLight(0xffd9b8, 9.0, 22, 2);
  chaseFill.position.set(0, 3.4, 6.4);
  g.add(chaseFill);
  var carKey = new THREE.DirectionalLight(0xffcfa0, 0.55);
  carKey.position.set(-3.5, 4.0, 5.0);
  g.add(carKey);
  g.add(carKey.target);

  // a soft blob under the car: the beam points forward, so without this the
  // car reads as hovering
  var blobMat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false,
    vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
    fragmentShader: 'varying vec2 vUv; void main(){ float d = length(vUv - 0.5) * 2.0; float a = smoothstep(1.0, 0.2, d) * 0.6; gl_FragColor = vec4(0.0, 0.0, 0.0, a); }'
  });
  var blob = new THREE.Mesh(new THREE.CircleGeometry(2.55, 24), blobMat);
  blob.rotation.x = -Math.PI/2;
  blob.position.y = 0.035;
  g.add(blob);

  var tailGlow = new THREE.PointLight(0xff2a10, 0.28, 5, 2);
  tailGlow.position.set(0, 0.62, 2.48);
  g.add(tailGlow);

  // wheels
  for (var sx = -1; sx <= 1; sx += 2){
    for (var sz = -1; sz <= 1; sz += 2){
      var w = new THREE.Mesh(new THREE.CylinderGeometry(0.36, 0.36, 0.26, 14), rimMat);
      w.rotation.z = Math.PI/2;
      w.position.set(sx * 0.90, 0.36, sz * 1.42);
      w.castShadow = true;
      vis.add(w);
      CAR.wheels.push(w);
    }
  }

  // the dish, gimballed through the roof: rim, concave face and a feed arm so it
  // reads as a dish and not as a rear wing in silhouette
  part(new THREE.CylinderGeometry(0.045, 0.045, 0.46, 8), trimMat, 0, 1.40, 1.05);
  var dish = part(new THREE.CylinderGeometry(0.46, 0.13, 0.16, 20), dishMat, 0, 1.60, 1.05);
  dish.rotation.x = -0.55;
  var rim = part(new THREE.TorusGeometry(0.46, 0.022, 6, 24), trimMat, 0, 1.60, 1.05);
  rim.rotation.x = -0.55 + Math.PI/2;
  part(new THREE.SphereGeometry(0.055, 8, 6), sillMat, 0, 1.80, 0.86);
  part(new THREE.CylinderGeometry(0.012, 0.012, 0.34, 6), trimMat, 0, 1.70, 0.95).rotation.x = -0.55;

  g.position.copy(CAR.pos);
  scene.add(g);
  CAR.root = g;
  CAR.vis = vis;

  // the modelled body. Tripo's image-to-3D export first, then the hand-built
  // loft if that file is missing, then the boxes above if both fail.
  function fitArrow(gltf){
    var m = gltf.scene;
    m.traverse(function(o){
      if (!o.isMesh) return;
      o.castShadow = true; o.receiveShadow = false;
      var mt = o.material;
      if (!mt) return;
      if (mt.map){
        if (mt.name === 'tyre_tex'){         // rubber, not painted metal
          mt.color.setHex(0x8e8e8e); mt.roughness = 0.86; mt.metalness = 0.0;
        } else {
          // The scanned albedo is a matte black car, so it is a black hole at
          // dusk: no colour to light, whatever you point at it. Lift it once
          // into a canvas at load. Same hue, twice the value, and it costs a
          // 512 texture that was already being uploaded.
          try {
            var im = mt.map.image;
            var cv = document.createElement('canvas');
            cv.width = 512; cv.height = 512;
            var cx = cv.getContext('2d');
            cx.drawImage(im, 0, 0, 512, 512);
            var id = cx.getImageData(0, 0, 512, 512), dd = id.data;
            for (var q = 0; q < dd.length; q += 4){
              dd[q] = Math.min(255, dd[q] * 1.30);
              dd[q+1] = Math.min(255, dd[q+1] * 1.30);
              dd[q+2] = Math.min(255, dd[q+2] * 1.30);
            }
            cx.putImageData(id, 0, 0);
            var tx = new THREE.CanvasTexture(cv);
            tx.encoding = THREE.sRGBEncoding; tx.flipY = false;
            mt.map = tx;
          } catch(e){}
        }
        if (mt.map && mt.name !== 'tyre_tex') {
          mt.color.setHex(0x9fa4ac); mt.roughness = 0.50; mt.metalness = 0.08;
        }
      }
      // The export carries a normal map and high frequency roughness detail,
      // and something in it is emissive. On a black car under a low sun that
      // combination is glitter: bright specks all over the paint and the dish.
      // Flat surfaces and no self illumination, so the shape does the talking.
      mt.normalMap = null;
      mt.roughnessMap = null;
      mt.metalnessMap = null;
      mt.aoMapIntensity = 1.0;
      if (mt.emissive) mt.emissive.setHex(0x000000);
      mt.emissiveIntensity = 0;
      // stands in for sky bounce on matte black paint: enough that the body
      // reads as a surface, not enough to look like it is lit from inside
      if (mt.name !== 'tyre_tex' && mt.emissive){
        mt.emissive.setHex(0x120e0a);
        mt.emissiveIntensity = 0.30;
      }
      if (!mt.map && !mt.name.match(/tyre/)){ mt.color.setHex(0x2a2d33); }
      if (mt.name === 'paint'){ mt.color.setHex(0x2b3038); mt.roughness = 0.62; mt.metalness = 0.05; }
      if (mt.name === 'dish'){ mt.roughness = 0.88; mt.metalness = 0.04; }
      if (mt.name === 'rim'){ mt.color.setHex(0x333a46); mt.roughness = 0.55; mt.metalness = 0.45; }
      mt.needsUpdate = true;
    });
    while (vis.children.length) vis.remove(vis.children[0]);
    vis.add(m);
    CAR.wheels = [];
    CAR.wheelSpin = [];
    CAR.wheelNodes = [];
    m.traverse(function(o){
      if (/^(tyre|hub|hub_cap)/.test(o.name)) CAR.wheelSpin.push({ o:o, q:o.quaternion.clone() });
      // the fitted wheels: origin on the axle, so Y steers and X rolls.
      // Match the parent nodes only: the exporter splits each wheel into child
      // meshes called wheel_FL_mesh etc, and rotating those too doubles the
      // steer angle and the spin.
      if (/^wheel_(FL|FR|RL|RR)$/.test(o.name)){
        o.rotation.order = 'YXZ';
        CAR.wheelNodes.push({ o:o, front: /^wheel_F/.test(o.name) });
      }
    });
  }
  new THREE.GLTFLoader().load('models/arrow_wheels.glb', fitArrow, undefined, function(){
    new THREE.GLTFLoader().load('models/arrow_tripo.glb', fitArrow, undefined, function(){
      new THREE.GLTFLoader().load('models/arrow_game.glb', fitArrow, undefined, function(e){
        console.warn('no car model found, the box car stays', e);
      });
    });
  });
})();

// four wheel samples: height, plus the pitch and roll that keeps the car on a slope
// chassis height first, then wheel samples taken from that height. Sampling the
// wheels against the car's own y is what made a steep ramp disappear: the body
// lagged, the reach fell short, the surface vanished, and the car sank.
function carGround(){
  var fx = -Math.sin(CAR.yaw), fz = -Math.cos(CAR.yaw);
  var rx =  Math.cos(CAR.yaw), rz = -Math.sin(CAR.yaw);
  var hf = CARTUNE.wheelbase/2, ht = CARTUNE.track/2;

  var under = surfaceAt(CAR.pos.x, CAR.pos.z, CAR.pos.y + 0.55, 0.0);
  var y = under === null ? 0 : under;

  function h(dx, dz){
    var s = surfaceAt(CAR.pos.x + dx, CAR.pos.z + dz, y + 0.95, 0.0);
    return s === null ? y : s;
  }
  var fl = h(fx*hf - rx*ht, fz*hf - rz*ht);
  var fr = h(fx*hf + rx*ht, fz*hf + rz*ht);
  var rl = h(-fx*hf - rx*ht, -fz*hf - rz*ht);
  var rr = h(-fx*hf + rx*ht, -fz*hf + rz*ht);
  var front = (fl + fr) / 2, rear = (rl + rr) / 2;
  var left = (fl + rl) / 2, right = (fr + rr) / 2;
  return {
    y: y,
    pitch: Math.atan2(front - rear, CARTUNE.wheelbase),
    roll: Math.atan2(right - left, CARTUNE.track)
  };
}

function stepCar(dt){
  CAR.lastHit = '';
  var throttle = (keys['KeyW'] || keys['ArrowUp']) ? 1 : 0;
  var braking  = (keys['KeyS'] || keys['ArrowDown']) ? 1 : 0;
  var steerIn  = ((keys['KeyA'] || keys['ArrowLeft']) ? 1 : 0) - ((keys['KeyD'] || keys['ArrowRight']) ? 1 : 0);
  // touch: the stick is wheel and pedal. Push up to drive, pull down to brake
  // and then reverse, sideways to steer. Screen y is inverted, so up is -y.
  if (STICK.active){
    var sy = -STICK.y;
    if (sy >  0.22) throttle = Math.max(throttle, Math.min(1, sy * 1.7));
    if (sy < -0.22) braking  = Math.max(braking,  Math.min(1, -sy * 1.7));
    if (Math.abs(STICK.x) > 0.14)
      steerIn -= Math.sign(STICK.x) * Math.min(1, (Math.abs(STICK.x) - 0.14) * 1.9);
  }
  var hand     = !!keys['Space'] || TOUCH.hand;
  CAR.hand = hand;

  if (!CAR.grounded) throttle = Math.min(throttle, 0.25);

  // steering: smoothed toward the input, self-centres when you let go
  var want = steerIn * CARTUNE.steerMax;
  var rate = steerIn ? CARTUNE.steerRate : CARTUNE.steerBack;
  var ds = want - CAR.steer;
  CAR.steer += Math.max(-rate*dt, Math.min(rate*dt, ds));

  var fx = -Math.sin(CAR.yaw), fz = -Math.cos(CAR.yaw);
  var rx =  Math.cos(CAR.yaw), rz = -Math.sin(CAR.yaw);
  var vF = CAR.vel.x*fx + CAR.vel.z*fz;
  var vR = CAR.vel.x*rx + CAR.vel.z*rz;

  // a handbrake that only removes lateral grip is invisible: drive straight
  // and it does nothing at all. This one cuts the power, locks the rear wheels
  // so they scrub speed, and still lets the tail step out.
  if (hand) throttle = 0;
  if (throttle) vF += CARTUNE.accel * dt;
  if (braking){
    if (vF > 0.3) vF -= CARTUNE.brake * dt;
    else vF = Math.max(-CARTUNE.reverseMax, vF - CARTUNE.reverseMax * 0.55 * dt);
  }
  if (hand){
    var lock = CARTUNE.handDecel * dt;
    if (Math.abs(vF) <= lock) vF = 0; else vF -= (vF > 0 ? 1 : -1) * lock;
  }
  if (!throttle && !braking){
    var rr2 = CARTUNE.rollRes * dt;
    if (Math.abs(vF) < rr2) vF = 0; else vF -= Math.sign(vF) * rr2;
  }
  // drag, then the top end
  vF -= vF * CARTUNE.drag * (Math.abs(vF) / CARTUNE.top) * dt;
  vF = Math.max(-CARTUNE.reverseMax, Math.min(CARTUNE.top, vF));

  // the heading turns because the front wheels point somewhere else
  if (Math.abs(vF) > 0.12 && CAR.grounded){
    CAR.yaw += (vF / CARTUNE.wheelbase) * Math.tan(CAR.steer) * dt;
  }

  // lateral grip, and the handbrake is what takes it away
  vR -= vR * Math.min(1, (hand ? CARTUNE.gripHand : CARTUNE.grip) * dt);

  fx = -Math.sin(CAR.yaw); fz = -Math.cos(CAR.yaw);
  rx =  Math.cos(CAR.yaw); rz = -Math.sin(CAR.yaw);
  CAR.vel.x = fx*vF + rx*vR;
  CAR.vel.z = fz*vF + rz*vR;

  // move one axis at a time and refuse the move if it would put the hull inside
  // something. Never resolving penetration is what keeps thin walls stable.
  var ox = CAR.pos.x;
  CAR.pos.x += CAR.vel.x * dt;
  var hx = carHitAt(CAR.pos.x, CAR.pos.z);
  if (hx){ CAR.pos.x = ox; CAR.vel.x *= -0.15; CAR.lastHit = (hx.name || 'box') + '@' + hx.y1.toFixed(2); }
  var oz = CAR.pos.z;
  CAR.pos.z += CAR.vel.z * dt;
  var hz = carHitAt(CAR.pos.x, CAR.pos.z);
  if (hz){ CAR.pos.z = oz; CAR.vel.z *= -0.15; CAR.lastHit = (hz.name || 'box') + '@' + hz.y1.toFixed(2); }

  // ground: the surface under the wheels either carries the car or it falls.
  // No lag on the way up, or the ground sampler loses a slope the car is on.
  var gr = carGround();
  var dy = gr.y - CAR.pos.y;
  if (dy > -0.45 && dy < 0.45){
    CAR.pos.y = gr.y; CAR.vy = 0; CAR.grounded = true;
  } else if (dy >= 0.45){
    CAR.pos.y += Math.min(dy, 0.5); CAR.vy = 0; CAR.grounded = true;
  } else {
    CAR.vy -= TUNE.gravity * dt;
    CAR.pos.y += CAR.vy * dt;
    if (CAR.pos.y < gr.y){ CAR.pos.y = gr.y; CAR.vy = 0; }
    CAR.grounded = (CAR.pos.y - gr.y) < 0.18;
  }
  CAR.pitch += (gr.pitch - CAR.pitch) * Math.min(1, dt * 8);
  CAR.roll  += (gr.roll  - CAR.roll ) * Math.min(1, dt * 8);
  // wheel roll: signed by how fast the car is actually moving along its own
  // nose. Using the speed here (always positive) meant the wheels turned one
  // way whatever you did, which reads as reversing while you drive forward.
  var fwdSpd = -(CAR.vel.x * Math.sin(CAR.yaw) + CAR.vel.z * Math.cos(CAR.yaw));
  CAR.spin -= fwdSpd * dt / 0.355;
  // the rear pair is locked while the handbrake is on, so they stop turning
  // while the fronts keep rolling. That difference is what reads as a lock.
  if (!CAR.hand) CAR.spinLock -= fwdSpd * dt / 0.355;
}

// anything solid at this hull point, at this height band
function solidAt(cx, cz, lo, hi, base){
  var i, b;
  for (i=0;i<boxes.length;i++){
    b = boxes[i];
    if (hi <= b.y0 + 0.02 || lo >= b.y1 - 0.02) continue;
    if (b.y1 <= base + 0.02) continue;                 // below the wheels, drive over it
    if (b.y1 > base && b.y1 - base <= 0.85) continue;  // a kerb the wheels ride up
    if (overlapXZ(b, cx, cz, CARTUNE.radius)) return b;
  }
  for (i=0;i<wallBoxes.length;i++){
    b = wallBoxes[i];
    if (hi <= b.y0 + 0.02 || lo >= b.y1 - 0.02) continue;
    if (b.y1 <= base + 0.02) continue;
    if (b.y1 > base && b.y1 - base <= 0.85) continue;
    if (overlapXZ(b, cx, cz, CARTUNE.radius)) return b;
  }
  return null;
}

// does the car's two-circle hull overlap anything solid at this x/z?
function carHitAt(x, z){
  var fx = -Math.sin(CAR.yaw), fz = -Math.cos(CAR.yaw);
  var lo = CAR.pos.y + 0.34, hi = CAR.pos.y + CARTUNE.height;
  for (var s = -1; s <= 1; s += 2){
    var cx = x + fx * CARTUNE.halfLen * s;
    var cz = z + fz * CARTUNE.halfLen * s;
    // the lip test is relative to the surface under THAT end of the car, not
    // the centre, or a nose up a slope reads as hitting a wall
    var here = surfaceAt(cx, cz, CAR.pos.y + 1.40, 0.0);
    var base = here === null ? CAR.pos.y : here;
    var hit = solidAt(cx, cz, lo, hi, base);
    if (hit) return hit;
    var tdx = cx - TANK.x, tdz = cz - TANK.z;
    if (CAR.pos.y < 6.0 && Math.hypot(tdx, tdz) < TANK.r + CARTUNE.radius) return {name:'tank', y1:6.8};
  }
  return null;
}


var _spinQ = new THREE.Quaternion();
var _axX = new THREE.Vector3(1, 0, 0);

function animateCar(){
  var g = CAR.root;
  g.position.copy(CAR.pos);
  g.rotation.y = CAR.yaw;
  g.rotation.x = CAR.pitch;
  g.rotation.z = CAR.roll;
  if (CAR.wheelNodes && CAR.wheelNodes.length){
    // front pair steers, all four roll. YXZ order, so Y turns the wheel in the
    // arch and X spins it about its own axle without fighting the steer angle.
    for (var k=0;k<CAR.wheelNodes.length;k++){
      var wn = CAR.wheelNodes[k];
      wn.o.rotation.y = wn.front ? CAR.steer : 0;
      wn.o.rotation.x = wn.front ? CAR.spin : CAR.spinLock;
    }
  } else if (CAR.wheelSpin && CAR.wheelSpin.length){
    _spinQ.setFromAxisAngle(_axX, CAR.spin);
    for (var k=0;k<CAR.wheelSpin.length;k++){
      var ws = CAR.wheelSpin[k];
      ws.o.quaternion.copy(_spinQ).multiply(ws.q);
    }
  } else {
    for (var i=0;i<CAR.wheels.length;i++) CAR.wheels[i].rotation.x = CAR.spin;
  }
}

function nearCar(){
  return Math.hypot(P.pos.x - CAR.pos.x, P.pos.z - CAR.pos.z) < 3.6 && Math.abs(P.pos.y - CAR.pos.y) < 2.2;
}

function enterCar(){
  MODE = 'car';
  avatarSet(false);
  torch.visible = false;
  CARCAM.yaw = CAR.yaw; CARCAM.idle = 9;
  // the touch pads are labelled, so no keyboard instructions there
  G.msg = IS_TOUCH ? '' : 'CALDER ARROW · W/S THROTTLE · A/D STEER · SPACE HANDBRAKE · E GET OUT';
  G.msgT = 4.0;
  UI_SIG = ''; refreshUI();
}

function exitCar(){
  MODE = 'foot';
  var rx = Math.cos(CAR.yaw), rz = -Math.sin(CAR.yaw);
  P.pos.set(CAR.pos.x + rx * 1.9, CAR.pos.y + 0.05, CAR.pos.z + rz * 1.9);
  P.vel.set(0, 0, 0); P.vault = null; P.grounded = false;
  avatarSet(true);
  torch.visible = true;
  AV.root.position.set(P.pos.x, P.pos.y, P.pos.z);
  TOUCH.hand = false;           // never exit with the handbrake stuck on
  UI_SIG = ''; refreshUI();
}

// ---------------------------------------------------------------- baked yard
var meshes = [];
var wallBoxes = [];   // yard geometry the car is not allowed to drive through
new THREE.GLTFLoader().load('bakenight/night.glb', function(gltf){
  scene.add(gltf.scene);
  gltf.scene.updateMatrixWorld(true);
  gltf.scene.traverse(function(o){
    if (!o.isMesh) return;
    meshes.push(o);
    o.castShadow = true; o.receiveShadow = true;
    if (o.geometry.attributes.uv && !o.geometry.attributes.uv2)
      o.geometry.setAttribute('uv2', o.geometry.attributes.uv);
    var m = o.material;
    // the bake is gone: these surfaces are lit by the sun and the sky now, so
    // the only things allowed to emit are the actual fixtures
    if (m && m.emissive){
      if (/^(lamp|beacon)$/.test(m.name || '')) m.emissiveIntensity = m.emissiveMap ? 2.2 : 6.0;
      else { m.emissiveMap = null; m.emissive = new THREE.Color(0x000000); m.emissiveIntensity = 0; }
    }

    // anything taller than a kerb becomes a car collider, so the car stops at
    // the sheds and posts instead of driving out through the side of the yard.
    // Ramps are excluded: their axis aligned box is a 4 m wall and the slope is
    // already handled by rampY, so including them would wall off the gantry.
    if (!o.geometry.attributes.position) return;
    var bb = new THREE.Box3().setFromObject(o);
    if (!isFinite(bb.min.x)) return;
    if (bb.max.y - bb.min.y <= 0.9 || bb.min.y >= 3.0) return;
    for (var i=0;i<ramps.length;i++){
      var r = ramps[i];
      var rx0 = Math.min(r.x0, r.x1), rx1 = Math.max(r.x0, r.x1);
      var rz0 = Math.min(r.z0, r.z1), rz1 = Math.max(r.z0, r.z1);
      if (Math.min(bb.max.x, rx1) > Math.max(bb.min.x, rx0) &&
          Math.min(bb.max.z, rz1) > Math.max(bb.min.z, rz0)) return;
    }
    wallBoxes.push({ x0:bb.min.x, x1:bb.max.x, z0:bb.min.z, z1:bb.max.z,
                     y0:Math.max(bb.min.y, 0), y1:bb.max.y, name:o.name || '' });
  });
  if (window.COURSE) window.COURSE.wallCount = wallBoxes.length;

  // ------------------------------------------------------------ photo surfaces
  // Every yard material was a flat colour with a baked lightmap on it, which is
  // exactly why it read as a render: there was no photograph anywhere in the
  // scene. These are CC0 photo scans from Poly Haven, 1 k, 1.8 MB for all three
  // sets, and they replace the bake as the thing that carries the detail.
  var YTEX = {};
  var TEX_FILES = ['asphalt_col','asphalt_nrm','asphalt_rgh',
                   'concrete_col','concrete_nrm','concrete_rgh',
                   'metal_col','metal_nrm','metal_rgh',
                   'ground_col','ground_nrm','ground_rgh','pebble_col'];
  var texLeft = TEX_FILES.length;
  TEX_FILES.forEach(function(f){
    new THREE.TextureLoader().load('models/tex/' + f + '.jpg', function(t){
      t.encoding = /_col$/.test(f) ? THREE.sRGBEncoding : THREE.LinearEncoding;
      t.wrapS = t.wrapT = THREE.RepeatWrapping;
      t.anisotropy = renderer.capabilities.getMaxAnisotropy();
      YTEX[f] = t;
      if (--texLeft === 0) applyYardTextures();
    }, undefined, function(e){
      console.warn('texture failed', f, e);
      if (--texLeft === 0) applyYardTextures();
    });
  });

  // world space triplanar, so the texel density is the same on a 70 m floor, a
  // 26 m concrete wall and a 34 m pipe without touching a single UV
  function triplanar(mat, col, rgh, scale, metal){
    if (mat.userData && mat.userData.tripl) return;
    mat.userData.tripl = true;
    mat.map = col;
    mat.roughnessMap = rgh;
    mat.color = new THREE.Color(0xffffff);
    mat.metalness = metal;
    mat.roughness = 1.0;
    mat.needsUpdate = true;
    mat.onBeforeCompile = function(sh){
      sh.uniforms.uTriScale = { value: scale };
      sh.vertexShader = sh.vertexShader
        .replace('#include <common>', '#include <common>\nvarying vec3 vTriPos;\nvarying vec3 vTriNrm;')
        .replace('#include <project_vertex>',
          '#include <project_vertex>\n  vTriPos = (modelMatrix * vec4(transformed, 1.0)).xyz;\n  vTriNrm = normalize(mat3(modelMatrix) * objectNormal);');
      sh.fragmentShader = sh.fragmentShader
        .replace('#include <common>',
          '#include <common>\nvarying vec3 vTriPos;\nvarying vec3 vTriNrm;\nuniform float uTriScale;\nvec3 triW;')
        .replace('#include <clipping_planes_fragment>',
          '#include <clipping_planes_fragment>\n  { vec3 tw = pow(abs(normalize(vTriNrm)), vec3(6.0)); triW = tw / max(1e-4, tw.x + tw.y + tw.z); }')
        .replace(/texture2D\(\s*map\s*,\s*vUv\s*\)/,
          '( texture2D( map, vTriPos.zy * uTriScale ) * triW.x + texture2D( map, vTriPos.xz * uTriScale ) * triW.y + texture2D( map, vTriPos.xy * uTriScale ) * triW.z )')
        .replace(/texture2D\(\s*roughnessMap\s*,\s*vUv\s*\)/,
          '( texture2D( roughnessMap, vTriPos.zy * uTriScale ) * triW.x + texture2D( roughnessMap, vTriPos.xz * uTriScale ) * triW.y + texture2D( roughnessMap, vTriPos.xy * uTriScale ) * triW.z )');
      if (sh.fragmentShader.indexOf('vTriPos.zy') === -1)
        console.warn('triplanar did not patch map_fragment on', mat.name);
    };
  }

  // A photographed ground, in world space, at two scales at once.
  //
  // One tiled photo cannot be both the plain and the gravel under the wheels:
  // at 40 m a tile it is a flat average up close, and at 2 m a tile the repeat
  // is visible across a 520 m disc. So the macro scan carries the colour of the
  // ground, and the pebble scan is divided by its own mean and multiplied in,
  // which adds high frequency without moving the average colour anywhere. The
  // ground also gets a real normal map, because a low sun raking a flat plane
  // is the reason the plain read as a plane.
  //
  // The pebble mean is measured off the file (linear 0.290/0.235/0.179), so the
  // detail layer is a modulation and not a second tint.
  var PEBBLE_MEAN = new THREE.Vector3(0.290, 0.235, 0.179);

  function photoground(mat, col, rgh, nrm, det, macScale, detScale, detAmt, tint, nrmAmt, desat){
    if (!col) return;
    [col, rgh, nrm, det].forEach(function(t){
      if (!t) return;
      // sampled by hand below, so the value must be raw and the sRGB curve is
      // applied in the shader. Hardware sRGB decode would double it.
      t.encoding = THREE.LinearEncoding;
      t.wrapS = t.wrapT = THREE.RepeatWrapping;
      t.needsUpdate = true;
    });
    mat.map = null; mat.roughnessMap = null; mat.normalMap = null;
    if (mat.color && mat.color.setHex) mat.color.setHex(tint);
    mat.metalness = 0.0;
    mat.roughness = 1.0;
    mat.userData.ground = true;
    mat.needsUpdate = true;
    mat.onBeforeCompile = function(sh){
      sh.uniforms.uGCol = {value: col};
      sh.uniforms.uGRgh = {value: rgh};
      sh.uniforms.uGNrm = {value: nrm};
      sh.uniforms.uGDet = {value: det};
      sh.uniforms.uGMac = {value: macScale};
      sh.uniforms.uGDetS = {value: detScale};
      sh.uniforms.uGDetAmt = {value: detAmt};
      sh.uniforms.uGNrmAmt = {value: nrmAmt};
      sh.uniforms.uGDesat = {value: desat === undefined ? 0.5 : desat};
      sh.uniforms.uGDetMean = {value: PEBBLE_MEAN};
      sh.vertexShader = sh.vertexShader
        .replace('#include <common>', '#include <common>\nvarying vec3 vGPos;')
        .replace('#include <project_vertex>',
          '#include <project_vertex>\n  vGPos = (modelMatrix * vec4(transformed, 1.0)).xyz;');
      sh.fragmentShader = sh.fragmentShader
        .replace('#include <common>', [
          '#include <common>',
          'varying vec3 vGPos;',
          'uniform sampler2D uGCol, uGRgh, uGNrm, uGDet;',
          'uniform float uGMac, uGDetS, uGDetAmt, uGNrmAmt, uGDesat;',
          'uniform vec3 uGDetMean;'
        ].join('\n'))
        .replace('#include <map_fragment>', [
          '#include <map_fragment>',
          '  vec2 gUV = vGPos.xz;',
          '  vec3 gCol = pow(texture2D(uGCol, gUV * uGMac).rgb, vec3(2.2));',
          // a photo of ground is a photo of LIT ground. Lighting it again with a
          // low warm sun multiplies the same warmth in twice and the whole
          // frame goes orange, so the albedo keeps the photo's structure and
          // brightness variation but loses most of its own hue.
          '  float gL = dot(gCol, vec3(0.2126, 0.7152, 0.0722));',
          '  gCol = mix(gCol, vec3(gL), uGDesat);',
          '  vec3 gDet = pow(texture2D(uGDet, gUV * uGDetS).rgb, vec3(2.2));',
          '  gDet = clamp(gDet / max(uGDetMean, vec3(0.02)), vec3(0.35), vec3(2.4));',
          // the detail layer fades out with distance. At 2.6 m a tile it is
          // aliasing well before the horizon, and moire on a grazing plane
          // reads as stripes of dirt that are not there.
          '  float gFade = 1.0 - smoothstep(22.0, 90.0, distance(cameraPosition, vGPos));',
          '  diffuseColor.rgb *= gCol * mix(vec3(1.0), gDet, uGDetAmt * gFade);'
        ].join('\n'))
        .replace('#include <roughnessmap_fragment>', [
          '#include <roughnessmap_fragment>',
          '  roughnessFactor *= texture2D(uGRgh, gUV * uGMac).g;'
        ].join('\n'))
        .replace('#include <normal_fragment_begin>', [
          '#include <normal_fragment_begin>',
          '  {',
          '    vec3 gN = texture2D(uGNrm, gUV * uGMac).xyz * 2.0 - 1.0;',
          // the ground is a flat plane with world-space uv, so the map's x and
          // y are world x and z. Enough to make gravel catch a low sun.
          '    normal = normalize(normal + vec3(gN.x, 0.0, gN.y) * uGNrmAmt);',
          '  }'
        ].join('\n'));
    };
  }

  function applyYardTextures(){
    meshes.forEach(function(o){
      var m = o.material;
      if (!m) return;
      var nm = m.name || '';
      if (nm === 'lamp' || nm === 'beacon') return;
      if (nm === 'wet_asphalt'){
        // the floor is a single 70 m plane unwrapped 0..1, so plain UVs tile
        // cleanly at 2 m per tile and it can keep a real normal map
        [YTEX.asphalt_col, YTEX.asphalt_nrm, YTEX.asphalt_rgh].forEach(function(t){
          if (t) t.repeat.set(35, 35);
        });
        m.map = YTEX.asphalt_col;
        m.normalMap = YTEX.asphalt_nrm;
        m.roughnessMap = YTEX.asphalt_rgh;
        m.normalScale = new THREE.Vector2(1.1, 1.1);
        m.color = new THREE.Color(0xffffff);
        m.metalness = 0.0;
        m.roughness = 1.0;
        m.needsUpdate = true;
      } else if (nm === 'concrete' || nm === 'facade'){
        triplanar(m, YTEX.concrete_col, YTEX.concrete_rgh, 0.34, 0.0);
      } else if (nm === 'dark_metal'){
        triplanar(m, YTEX.metal_col, YTEX.metal_rgh, 0.50, 0.55);
      } else if (nm === 'yellow_paint'){
        m.color = new THREE.Color(0xc8a23a);
        m.metalness = 0.1; m.roughness = 0.62;
        m.needsUpdate = true;
      }
    });
    // the pads, ramps and steps are our own geometry, so they get the concrete
    // scan as well. Without this they read as flat grey slabs next to the yard.
    [STEP_MAT, PANEL_MAT].forEach(function(mm){
      if (mm) triplanar(mm, YTEX.concrete_col, YTEX.concrete_rgh, 0.34, 0.0);
    });

    // the open plain: the desert photo at 40 m a tile with the pebble layer at
    // 2.6 m. This surface used to be asphalt tiled at 8.7 m, which is why the
    // ground read as a flat plane from the chase camera: at that distance the
    // tile mips down to one average colour.
    if (apronMat && YTEX.ground_col){
      photoground(apronMat, YTEX.ground_col, YTEX.ground_rgh, YTEX.ground_nrm,
                  YTEX.pebble_col, 0.025, 0.385, 0.55, 0xa8a093, 0.9, 0.55);
    }

    // the desert road gets its own clones: its UVs run with the distance along
    // the ribbon, so the texture must not keep the yard floor's 2 m repeat
    if (YTEX.asphalt_col){
      TRACK_MATS.forEach(function(t){
        if (t.kind === 'shoulder'){
          // the flat colour that used to sit either side of the road, and the
          // strip the chase camera looks at most. Same desert photo, tighter
          // tile, so the road edge is ground rather than a painted ribbon.
          photoground(t.mat, YTEX.ground_col, YTEX.ground_rgh, YTEX.ground_nrm,
                      YTEX.pebble_col, 0.25, 0.385, 0.45, 0x8f887c, 0.7, 0.55);
          return;
        }
        var col = YTEX.asphalt_col.clone(); col.needsUpdate = true; col.repeat.set(1, 1);
        var rgh = YTEX.asphalt_rgh.clone(); rgh.needsUpdate = true; rgh.repeat.set(1, 1);
        var nrm = YTEX.asphalt_nrm ? YTEX.asphalt_nrm.clone() : null;
        if (nrm){ nrm.needsUpdate = true; nrm.repeat.set(1, 1); }
        t.mat.map = col;
        t.mat.roughnessMap = rgh;
        t.mat.normalMap = nrm;
        t.mat.normalScale.set(t.kind === 'road' ? 0.85 : 0.6,
                              t.kind === 'road' ? 0.85 : 0.6);
        t.mat.color = new THREE.Color(t.kind === 'road' ? 0x82827d : 0xb08a5c);
        t.mat.metalness = 0.0;
        t.mat.roughness = 1.0;
        t.mat.needsUpdate = true;
      });
    }

    window.YARD_TEX = YTEX;
    window.YARD_READY = true;
  }
}, undefined, function(e){ console.error('glb', e); });

var AV = { phase: 0, yaw: 0, legL:null, legR:null, armL:null, armR:null, torso:null, hips:null, root:null };

// The character exists twice: a procedural rig parented to AV.root, and the
// rigged model loaded from a glb which gets parented to the scene. Hiding
// AV.root alone left the glb body standing exactly where the car spawns, which
// is the dark lump sitting on the bonnet. One function owns both.
function avatarSet(v){
  AV.root.visible = v;
  // Hide the model's meshes by their own flag as well. Toggling an ancestor
  // group is not enough: the glb's rig is parented somewhere this code does not
  // own, and any frame that re-parents or re-shows it puts the character back
  // on the car bonnet. The mesh flag is local and cannot be undone elsewhere.
  if (!AV.meshes){
    AV.meshes = [];
    scene.traverse(function(o){
      if (o.isMesh && (o.name === 'Waldo' || (o.parent && o.parent.name === 'WaldoRig')))
        AV.meshes.push(o);
    });
  }
  for (var i = 0; i < AV.meshes.length; i++) AV.meshes[i].visible = v;
  if (AV.glb) AV.glb.visible = v;
}

// ---------------------------------------------------------------- characters
var MIXER = null, CUR = null, CURNAME = '', HOLDER = null, ACT = null, CH = null;

var CHARS = [
  { id:'waldo',     label:'WALDO',     file:'models/waldo_game.glb',      h:1.75, face:Math.PI,
    cad:{ walk:1.45, run:3.25 },
    clips:{ idle:['idle'], walk:['walk'], run:['run'], jump:[] } },
];

function findClip(all, list){
  for (var i = 0; i < list.length; i++){
    for (var k in all){ if (k.toLowerCase() === list[i]) return all[k]; }
  }
  return null;
}

function play(name, fade){
  if (!ACT) return;
  var next = ACT[name] || ACT.run || ACT.walk || ACT.idle;
  if (!next) return;
  var f = fade === undefined ? 0.2 : fade;
  if (next === CUR) { CURNAME = name; return; }
  if (CUR) CUR.fadeOut(f);
  next.reset().fadeIn(f).play();
  CUR = next; CURNAME = name;
}

function loadChar(id){
  var cfg = CHARS[0];
  for (var i = 0; i < CHARS.length; i++) if (CHARS[i].id === id) cfg = CHARS[i];
  CH = cfg;
  if (HOLDER && HOLDER.parent) HOLDER.parent.remove(HOLDER);
  if (CUR) { CUR.stop(); CUR = null; }
  CURNAME = ''; MIXER = null; ACT = null;

  new THREE.GLTFLoader().load(CH.file, function(gltf){
    var m = gltf.scene;
    m.traverse(function(o){
      if (o.isMesh){
        o.castShadow = true; o.receiveShadow = true; o.frustumCulled = false;
        if (o.material && o.material.roughness !== undefined){
          o.material.roughness = Math.min(1, (o.material.roughness || 0.8) * 1.05);
        }
      }
    });
    m.updateMatrixWorld(true);
    var bb = new THREE.Box3().setFromObject(m);
    var height = bb.getSize(new THREE.Vector3()).y;
    var minY = bb.min.y;

    // a SkinnedMesh bounding box is the bind pose, which ignores the skeleton's own scale.
    // when bones say the rig is a different size, believe the bones.
    var bmin = Infinity, bmax = -Infinity, v = new THREE.Vector3();
    m.traverse(function(o){
      if (o.isBone){ o.getWorldPosition(v); bmin = Math.min(bmin, v.y); bmax = Math.max(bmax, v.y); }
    });
    if (bmax > bmin){
      var boneH = bmax - bmin;
      if (boneH > height * 1.5 || boneH < height * 0.5){
        height = boneH * 1.12;      // head top sits above the top bone
        minY = bmin - boneH * 0.05; // and the sole sits below the ankle bone
      }
    }

    var s = CH.h / Math.max(0.001, height);
    m.scale.setScalar(s);
    m.position.y = -minY * s;

    HOLDER = new THREE.Group();
    HOLDER.rotation.y = CH.face;
    HOLDER.add(m);
    AV.root.add(HOLDER);
    if (AV.hips) AV.hips.visible = false;

    MIXER = new THREE.AnimationMixer(m);
    var all = {};
    gltf.animations.forEach(function(c){ all[c.name] = MIXER.clipAction(c); });
    ACT = {
      idle: findClip(all, CH.clips.idle),
      walk: findClip(all, CH.clips.walk),
      run:  findClip(all, CH.clips.run),
      jump: findClip(all, CH.clips.jump)
    };
    window.__clips = Object.keys(all);
    play('idle', 0);
    window.AV_READY = true;
  }, undefined, function(e){ console.warn('character failed to load', e); });
}

// ---------------------------------------------------------------- third person camera
var CAM = { mode:'third', yaw:0, pitch:0.17, dist:3.10, cur:3.10, shoulder:0.22,
            target:new THREE.Vector3(), idle:9 };
var camRay = new THREE.Raycaster();
var camSolids = padSolids;

function placeCamera(dt){
  var eyeY = 1.34;
  var spd = Math.hypot(P.vel.x, P.vel.z);
  CAM.target.set(P.pos.x, P.pos.y + eyeY, P.pos.z);

  if (CAM.mode === 'first'){
    camera.position.set(P.pos.x, P.pos.y + 1.55, P.pos.z);
    camera.rotation.set(-CAM.pitch, CAM.yaw, 0);
    return;
  }

  // swing back behind the run on its own, unless the player is looking around
  // or running at the camera
  CAM.idle += dt;
  if (CAM.idle > 0.9 && spd > 1.4 && !P.vault){
    var fwdX = -Math.sin(CAM.yaw), fwdZ = -Math.cos(CAM.yaw);
    if ((P.vel.x * fwdX + P.vel.z * fwdZ) / spd > 0.2){
      var ty = Math.atan2(-P.vel.x, -P.vel.z);
      var dd = ((ty - CAM.yaw + Math.PI*3) % (Math.PI*2)) - Math.PI;
      CAM.yaw += dd * Math.min(1, dt * 1.7);
    }
  }

  // the lens opens and the arm pays out a little at speed
  var wantFov = 55 + Math.min(6, spd * 0.9);
  var wantDist = CAM.dist + Math.min(0.75, spd * 0.10);

  var cp = Math.cos(CAM.pitch), sp = Math.sin(CAM.pitch);
  var dir = new THREE.Vector3(Math.sin(CAM.yaw) * cp, sp, Math.cos(CAM.yaw) * cp);
  // shoulder offset so the body sits left of centre, the way a follow cam does
  var right = new THREE.Vector3(Math.cos(CAM.yaw), 0, -Math.sin(CAM.yaw));
  CAM.target.addScaledVector(right, CAM.shoulder);
  // pull in if a pad or the yard is between us and the character
  var want = CAM.target.clone().addScaledVector(dir, wantDist);
  var toCam = want.clone().sub(CAM.target);
  var len = toCam.length();
  camRay.set(CAM.target, toCam.normalize());
  camRay.far = len;
  var hits = camRay.intersectObjects(camSolids.concat(meshes), true);
  if (hits.length && hits[0].distance < len){
    len = Math.max(0.85, hits[0].distance - 0.22);
  }
  CAM.cur += (len - CAM.cur) * Math.min(1, dt * (len < CAM.cur ? 18 : 6));
  camera.position.copy(CAM.target).addScaledVector(dir, CAM.cur);
  camera.lookAt(CAM.target.x - Math.sin(CAM.yaw)*0.55, CAM.target.y + 0.12, CAM.target.z - Math.cos(CAM.yaw)*0.55);
  if (Math.abs(camera.fov - wantFov) > 0.02){
    camera.fov += (wantFov - camera.fov) * Math.min(1, dt * 3.2);
    camera.updateProjectionMatrix();
  }
}

// chase camera for the car: sits behind the heading, pays out and opens the
// lens with speed, and lets the mouse look around before it swings back
// longer lens needs a longer dolly: at 46 degrees and 7.4 m the car filled
// two thirds of the frame and read as a first person view
var CARCAM = { yaw:0, dist:9.6, cur:9.6, pitch:0.30, idle:9 };

function placeCarCamera(dt){
  var spd = Math.hypot(CAR.vel.x, CAR.vel.z);
  CARCAM.idle += dt;
  if (CARCAM.idle > 0.7){
    var ty = CAR.yaw;
    var dd = ((ty - CARCAM.yaw + Math.PI*3) % (Math.PI*2)) - Math.PI;
    CARCAM.yaw += dd * Math.min(1, dt * (2.2 + spd * 0.14));
  }

  // longer lens, further back: the same car fills the frame but the
  // perspective flattens, which is most of what makes a shot look photographed
  var wantDist = CARCAM.dist + Math.min(1.8, spd * 0.09);
  var wantFov  = 50 + Math.min(8, spd * 0.55);

  var cp = Math.cos(CARCAM.pitch), sp = Math.sin(CARCAM.pitch);
  var dir = new THREE.Vector3(Math.sin(CARCAM.yaw) * cp, sp, Math.cos(CARCAM.yaw) * cp);
  var target = new THREE.Vector3(CAR.pos.x, CAR.pos.y + 1.15, CAR.pos.z);
  var want = target.clone().addScaledVector(dir, wantDist);
  var toCam = want.clone().sub(target);
  var len = toCam.length();
  camRay.set(target, toCam.normalize());
  camRay.far = len;
  var hits = camRay.intersectObjects(camSolids.concat(meshes), true);
  if (hits.length && hits[0].distance < len) len = Math.max(1.4, hits[0].distance - 0.25);
  CARCAM.cur += (len - CARCAM.cur) * Math.min(1, dt * (len < CARCAM.cur ? 16 : 5));

  camera.position.copy(target).addScaledVector(dir, CARCAM.cur);
  var fwdX = -Math.sin(CARCAM.yaw), fwdZ = -Math.cos(CARCAM.yaw);
  camera.lookAt(target.x + fwdX * 3.2, target.y + 0.35, target.z + fwdZ * 3.2);
  if (Math.abs(camera.fov - wantFov) > 0.02){
    camera.fov += (wantFov - camera.fov) * Math.min(1, dt * 3.0);
    camera.updateProjectionMatrix();
  }
}

function animateAvatar(dt, speed){
  AV.root.position.set(P.pos.x, P.pos.y, P.pos.z);
  AV.root.rotation.y = AV.yaw;

  if (MIXER){
    var want = 'idle';
    if (!P.grounded && speed > 0.4 && ACT && ACT.jump) want = 'jump';
    else if (!P.grounded && speed > 0.4) want = 'run';
    else if (speed > 3.3) want = 'run';
    else if (speed > 0.35) want = 'walk';
    play(want);
    // keep the stride roughly in step with the ground speed
    if (CUR){
      var cadW = (CH && CH.cad && CH.cad.walk) || 2.6;
      var cadR = (CH && CH.cad && CH.cad.run)  || 4.4;
      if (CURNAME === 'run')  CUR.timeScale = Math.max(0.65, Math.min(1.7, speed / cadR));
      else if (CURNAME === 'walk') CUR.timeScale = Math.max(0.6, Math.min(1.6, speed / cadW));
      else CUR.timeScale = 1;
    }
    MIXER.update(dt);
  } else if (AV.hips && AV.hips.visible){
    AV.phase += dt * speed * 2.9;
    var s = Math.min(1, speed / 4.5);
    var sw = Math.sin(AV.phase);
    if (P.grounded){
      AV.legL.rotation.x =  sw * 0.78 * s;
      AV.legR.rotation.x = -sw * 0.78 * s;
      AV.armL.rotation.x = -sw * 0.62 * s;
      AV.armR.rotation.x =  sw * 0.62 * s;
    } else {
      AV.legL.rotation.x = -0.55; AV.legR.rotation.x = 0.32;
    }
  }
}

    CARCAM.idle = 0;

  CAM.yaw   -= e.movementX * 0.0024;
  CAM.pitch += e.movementY * 0.0018;

canvas.addEventListener('touchstart', function(e){
  useTouch(true);
  for (var i=0;i<e.changedTouches.length;i++){
    var t = e.changedTouches[i];
    if (t.clientX < window.innerWidth*0.5 && !STICK.active){
      STICK.active = true; STICK.id = t.identifier; STICK.cx = t.clientX; STICK.cy = t.clientY;
      // the ring appears where the thumb landed, so the stick centre and the
      // touch origin are the same point. Before, the input centred on the thumb
      // but the circle stayed pinned bottom left, so they disagreed.
      var rg = document.getElementById('ring');
      rg.style.left = t.clientX + 'px';
      rg.style.top  = t.clientY + 'px';
      rg.classList.add('on');
    } else if (!LOOK.active){
      LOOK.active = true; LOOK.id = t.identifier; LOOK.lx = t.clientX; LOOK.ly = t.clientY;
    }
  }
  e.preventDefault();
}, {passive:false});
canvas.addEventListener('touchmove', function(e){
  for (var i=0;i<e.changedTouches.length;i++){
    var t = e.changedTouches[i];
    if (t.identifier === STICK.id){
      var dx = (t.clientX - STICK.cx)/34, dy = (t.clientY - STICK.cy)/34;
      var len = Math.hypot(dx, dy) || 1;
      if (len > 1){ dx/=len; dy/=len; }
      STICK.x = dx; STICK.y = dy;
      document.getElementById('knob').style.transform = 'translate(' + (dx*30) + 'px,' + (dy*30) + 'px)';
    } else if (t.identifier === LOOK.id){
      var ldx = t.clientX - LOOK.lx, ldy = t.clientY - LOOK.ly;
      if (MODE === 'car'){
        // the car has its own camera. This used to write to the walking camera,
        // which is why dragging did nothing at all while driving.
        CARCAM.yaw   -= ldx * 0.0052;
        CARCAM.pitch  = Math.max(-0.08, Math.min(0.62, CARCAM.pitch + ldy * 0.0022));
        CARCAM.idle = 0;
      } else {
        CAM.yaw   -= ldx * 0.005;
        CAM.pitch  = Math.max(-0.55, Math.min(0.95, CAM.pitch + ldy * 0.0038));
        CAM.idle = 0;
      }
      LOOK.lx = t.clientX; LOOK.ly = t.clientY;
    }
  }
  e.preventDefault();
}, {passive:false});

// Two buttons, never one doing two jobs. Jump (or handbrake in the car) sits
// under the right thumb; interact is a separate target above it that only
// exists when there is something in reach. The research is blunt about this:
// a button that jumps and interacts at once gets the wrong one under pressure,
// which is exactly what the old single button did.
function pressBtn(el, down, up){
  el.addEventListener('touchstart', function(e){
    e.preventDefault(); e.stopPropagation();
    el.classList.add('act');
    try { if (navigator.vibrate) navigator.vibrate(10); } catch(err){}
    down();
  }, {passive:false});
  function release(e){
    if (e){ e.preventDefault(); e.stopPropagation(); }
    el.classList.remove('act');
    if (up) up();
  }
  el.addEventListener('touchend', release, {passive:false});
  el.addEventListener('touchcancel', release, {passive:false});
}

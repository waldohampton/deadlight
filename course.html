// ---------------------------------------------------------------- physics
// Two things turn hops into traversal: steps raise you without stopping, and
// slopes are continuous ground. Both resolve in the vertical pass, so the
// horizontal pass only ever blocks on something you cannot simply run up.
function overlapXZ(b, x, z, r){
  return x + r > b.x0 && x - r < b.x1 && z + r > b.z0 && z - r < b.z1;
}
function rampY(r, x, z){
  var t = r.axis === 'z' ? (z - r.z0)/(r.z1 - r.z0) : (x - r.x0)/(r.x1 - r.x0);
  return r.y0 + (r.y1 - r.y0) * Math.max(0, Math.min(1, t));
}

// highest surface at or below feet+reach at this xz, or null
function surfaceAt(x, z, feet, reach){
  var best = null, i, b;
  for (i=0;i<boxes.length;i++){
    b = boxes[i];
    if (b.y1 > feet + reach) continue;
    if (!overlapXZ(b, x, z, P.radius)) continue;
    if (best === null || b.y1 > best) best = b.y1;
  }
  for (i=0;i<ramps.length;i++){
    b = ramps[i];
    var ry = rampY(b, x, z);
    if (ry > feet + reach) continue;
    if (!overlapXZ(b, x, z, P.radius * 0.6)) continue;
    if (best === null || ry > best) best = ry;
  }
  return best;
}

// a vault: knee height to shoulder height, taken at speed, momentum kept
function beginVault(b, axis, spd, vx, vz){
  var dx = 0, dz = 0;
  if (axis === 'x') dx = vx >= 0 ? 1 : -1; else dz = vz >= 0 ? 1 : -1;
  var tx = P.pos.x, tz = P.pos.z;
  if (axis === 'x'){
    if (b.v === 'over') tx = (dx > 0 ? b.x1 : b.x0) + dx * (P.radius + 0.12);
    else tx = Math.max(b.x0 + P.radius*0.6, Math.min(b.x1 - P.radius*0.6, P.pos.x + dx * 0.55));
  } else {
    if (b.v === 'over') tz = (dz > 0 ? b.z1 : b.z0) + dz * (P.radius + 0.12);
    else tz = Math.max(b.z0 + P.radius*0.6, Math.min(b.z1 - P.radius*0.6, P.pos.z + dz * 0.55));
  }
  P.vault = {
    t:0, dur:0.20 + Math.min(0.14, Math.max(0, b.y1 - P.pos.y) * 0.10),
    from: P.pos.clone(), to: new THREE.Vector3(tx, b.y1 + 0.005, tz),
    dirX: dx, dirZ: dz, spd: Math.max(spd, 2.4)
  };
  P.vel.set(0, 0, 0);
  P.grounded = false;
  G.msg = ''; G.msgT = 0;
}

function stepVault(dt){
  var v = P.vault;
  v.t += dt;
  var k = Math.min(1, v.t / v.dur);
  var e = k * k * (3 - 2 * k);                 // smoothstep across the lip
  var arc = Math.sin(Math.PI * k) * 0.20;      // small hop so it reads as a vault
  P.pos.x = v.from.x + (v.to.x - v.from.x) * e;
  P.pos.z = v.from.z + (v.to.z - v.from.z) * e;
  P.pos.y = v.from.y + (v.to.y - v.from.y) * e + arc;
  AV.yaw += ((((Math.atan2(-v.dirX, -v.dirZ) - AV.yaw + Math.PI*3) % (Math.PI*2)) - Math.PI)) * Math.min(1, dt * 18);
  if (k >= 1){
    P.pos.copy(v.to);
    P.vel.set(v.dirX * v.spd * TUNE.vaultKeep, 0, v.dirZ * v.spd * TUNE.vaultKeep);
    P.grounded = true; P.coyote = TUNE.coyote;
    P.vault = null;
  }
}

function moveAndCollide(dt){
  if (P.vault){ stepVault(dt); return; }
  var steps = 2, h = dt/steps;
  for (var s=0; s<steps; s++){
    var preVX = P.vel.x, preVZ = P.vel.z;
    var preSpd = Math.hypot(preVX, preVZ);

    // vertical: fall, land, step up, or stay glued to a slope going down
    P.vel.y -= TUNE.gravity * h;
    var ny = P.pos.y + P.vel.y * h;
    var wasGrounded = P.grounded;
    var grounded = false;
    if (P.vel.y <= 0){
      var sup = surfaceAt(P.pos.x, P.pos.z, P.pos.y, TUNE.stepUp);
      if (sup !== null && ny <= sup){ ny = sup; P.vel.y = 0; grounded = true; }
      else if (wasGrounded && sup !== null && sup < ny && ny - sup <= 0.40){ ny = sup; P.vel.y = 0; grounded = true; }
    } else {
      for (var c=0;c<boxes.length;c++){
        var cb = boxes[c];
        if (P.pos.y + P.height <= cb.y0 + 0.02 || ny + P.height < cb.y0) continue;
        if (overlapXZ(cb, P.pos.x, P.pos.z, P.radius) && ny + P.height >= cb.y0){
          ny = cb.y0 - P.height; P.vel.y = 0;
        }
      }
    }
    if (ny <= 0){ ny = 0; P.vel.y = 0; grounded = true; }
    P.pos.y = ny;
    // only shave momentum on a real landing, never on a step
    if (grounded && !wasGrounded && P.vel.y === 0 && ny > 0.35){
      P.vel.x *= TUNE.landKeep; P.vel.z *= TUNE.landKeep;
    }
    P.grounded = grounded;

    // horizontal, one axis at a time so a wall stops one axis and you slide on the other
    var hit = null, j, bx;
    var nx = P.pos.x + P.vel.x * h;
    for (j=0;j<boxes.length;j++){
      bx = boxes[j];
      if (P.pos.y + P.height <= bx.y0 + 0.02 || P.pos.y >= bx.y1 - 0.02) continue;
      if (!(nx + P.radius > bx.x0 && nx - P.radius < bx.x1 &&
            P.pos.z + P.radius > bx.z0 && P.pos.z - P.radius < bx.z1)) continue;
      if (P.grounded && bx.y1 - P.pos.y <= TUNE.stepUp) continue;   // a step, vertical takes it
      if (!hit || bx.y1 < hit.b.y1) hit = {b:bx, axis:'x'};
      nx = P.vel.x > 0 ? bx.x0 - P.radius : bx.x1 + P.radius;
      P.vel.x = 0;
    }
    P.pos.x = nx;

    var nz = P.pos.z + P.vel.z * h;
    for (j=0;j<boxes.length;j++){
      bx = boxes[j];
      if (P.pos.y + P.height <= bx.y0 + 0.02 || P.pos.y >= bx.y1 - 0.02) continue;
      if (!(P.pos.x + P.radius > bx.x0 && P.pos.x - P.radius < bx.x1 &&
            nz + P.radius > bx.z0 && nz - P.radius < bx.z1)) continue;
      if (P.grounded && bx.y1 - P.pos.y <= TUNE.stepUp) continue;
      if (!hit || bx.y1 < hit.b.y1) hit = {b:bx, axis:'z'};
      nz = P.vel.z > 0 ? bx.z0 - P.radius : bx.z1 + P.radius;
      P.vel.z = 0;
    }
    P.pos.z = nz;

    // ran into something waist high at speed: vault it instead of stopping
    if (hit && preSpd > 1.2 && (hit.axis === 'x' ? preVX : preVZ) !== 0){
      var rise = hit.b.y1 - P.pos.y;
      if (rise > TUNE.stepUp && rise <= TUNE.vaultMax && (P.grounded || P.vel.y < 1.2)){
        beginVault(hit.b, hit.axis, preSpd, preVX, preVZ);
        return;
      }
    }

    // the tank is solid at ground level only
    var tdx = P.pos.x - TANK.x, tdz = P.pos.z - TANK.z;
    var td = Math.hypot(tdx, tdz) || 0.001;
    if (td < TANK.r + P.radius && P.pos.y < 1.9){
      var push = (TANK.r + P.radius - td);
      P.pos.x += (tdx/td) * push; P.pos.z += (tdz/td) * push;
    }
  }
}


// ---------------------------------------------------------------- film pass
// scene renders to a half-float target, blooming the lamps, then one composite
// does ACES, a warm/cool grade, vignette and grain. No post libraries.
var POST = (function(){
  var W = 1, H = 1;
  var rtScene, rtA, rtB;
  var quadScene = new THREE.Scene();
  var quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  var quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), null);
  quadScene.add(quad);

  var vert = 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }';

  var brightMat = new THREE.ShaderMaterial({
    uniforms: { tDiffuse:{value:null}, threshold:{value:1.70} },
    vertexShader: vert,
    fragmentShader: [
      'uniform sampler2D tDiffuse; uniform float threshold; varying vec2 vUv;',
      'void main(){',
      '  vec3 c = texture2D(tDiffuse, vUv).rgb;',
      '  float l = dot(c, vec3(0.2126,0.7152,0.0722));',
      '  float k = smoothstep(threshold, threshold*1.45 + 0.001, l);',
      '  gl_FragColor = vec4(c * k, 1.0);',
      '}'
    ].join('\n')
  });

  var blurMat = new THREE.ShaderMaterial({
    uniforms: { tDiffuse:{value:null}, dir:{value:new THREE.Vector2(1,0)} },
    vertexShader: vert,
    fragmentShader: [
      'uniform sampler2D tDiffuse; uniform vec2 dir; varying vec2 vUv;',
      'void main(){',
      '  vec3 s = texture2D(tDiffuse, vUv).rgb * 0.227027;',
      '  s += texture2D(tDiffuse, vUv + dir*2.6).rgb * 0.316216;',
      '  s += texture2D(tDiffuse, vUv - dir*2.6).rgb * 0.316216;',
      '  s += texture2D(tDiffuse, vUv + dir*6.1).rgb * 0.070270;',
      '  s += texture2D(tDiffuse, vUv - dir*6.1).rgb * 0.070270;',
      '  gl_FragColor = vec4(s, 1.0);',
      '}'
    ].join('\n')
  });

  var compMat = new THREE.ShaderMaterial({
    uniforms: {
      tDiffuse:{value:null}, tBloom:{value:null},
      tDepth:{value:null}, uRes:{value:new THREE.Vector2(1,1)},
      uAO:{value:0.90}, uNear:{value:0.05}, uFar:{value:300}, uProj:{value:800},
      uTime:{value:0}, uBloom:{value:0.55}, uExposure:{value:1.04},
      uGrain:{value:0.009}, uVig:{value:0.45}, uCA:{value:0.0022}
    },
    vertexShader: vert,
    fragmentShader: [
      'uniform sampler2D tDiffuse; uniform sampler2D tBloom;',
      'uniform sampler2D tDepth; uniform vec2 uRes;',
      'uniform float uAO, uNear, uFar, uProj;',
      'uniform float uTime, uBloom, uExposure, uGrain, uVig, uCA;',
      'varying vec2 vUv;',
      // linear view depth from the depth buffer, so occlusion is judged in
      // metres instead of in the hyperbolic depth that WebGL stores
      'float vz(vec2 q){ float dd = texture2D(tDepth, q).x * 2.0 - 1.0; return 2.0 * uNear * uFar / (uFar + uNear - dd * (uFar - uNear)); }',
      'vec3 aces(vec3 x){ return clamp((x*(2.51*x + 0.03)) / (x*(2.43*x + 0.59) + 0.14), 0.0, 1.0); }',
      'void main(){',
      '  vec2 uv = vUv;',
      '  vec2 d = uv - 0.5;',
      '  float r2 = dot(d, d);',
      '  vec3 c;',
      '  c.r = texture2D(tDiffuse, uv + d*uCA*r2*4.0).r;',
      '  c.g = texture2D(tDiffuse, uv).g;',
      '  c.b = texture2D(tDiffuse, uv - d*uCA*r2*4.0).b;',
      // screen space occlusion. Without the bake there is nothing darkening the
      // crease where a wheel meets the floor, and everything floats. Ten taps in
      // a ring, rotated per pixel so the pattern does not band.
      '  float z0 = vz(uv);',
      '  float ang = fract(sin(dot(uv, vec2(41.7, 289.1)) * 43758.5453)) * 6.2831;',
      '  float occ = 0.0;',
      '  for (int i = 0; i < 10; i++){',
      '    float a = ang + float(i) * 0.6283;',
      '    float rad = (0.40 + 0.60 * fract(float(i) * 0.618 + 0.31)) * 0.52;',
      '    vec2 o = vec2(cos(a), sin(a)) * rad * uProj / max(z0, 0.05);',
      '    float dz = z0 - vz(uv + o / uRes);',
      '    occ += clamp(1.0 - dz / 0.75, 0.0, 1.0) * step(0.02, dz);',
      '  }',
      '  c *= 1.0 - (occ / 10.0) * uAO;',
      '  c += texture2D(tBloom, uv).rgb * uBloom;',
      '  c *= uExposure;',
      '  c = aces(c);',
      '  float l = dot(c, vec3(0.2126,0.7152,0.0722));',
      '  vec3 cool = c * vec3(0.94, 0.96, 1.05) + vec3(0.006, 0.004, 0.012);',
      '  vec3 warm = c * vec3(1.16, 1.02, 0.83) + vec3(0.016, 0.008, 0.0);',
      '  c = mix(cool, warm, 0.15 + 0.85 * smoothstep(0.03, 0.62, l));',
      '  c = mix(vec3(l), c, 1.05);',
      '  c = clamp(c, 0.0, 1.0);',
      '  c = mix(c, c * c * (3.0 - 2.0 * c), 0.45);',
      '  c *= 1.0 - uVig * r2 * 1.5;',
      '  float g = fract(sin(dot(uv * vec2(1023.0, 767.0) + uTime, vec2(12.9898, 78.233))) * 43758.5453);',
      '  c += (g - 0.5) * uGrain;',
      '  c = pow(max(c, 0.0), vec3(1.0/2.2));',
      '  gl_FragColor = vec4(c, 1.0);',
      '}'
    ].join('\n')
  });

  function makeRT(w, h, hdr){
    var o = { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, format: THREE.RGBAFormat,
              depthBuffer: true, stencilBuffer: false };
    if (hdr) o.type = THREE.HalfFloatType;
    return new THREE.WebGLRenderTarget(Math.max(1, w), Math.max(1, h), o);
  }

  function resize(){
    W = window.innerWidth; H = window.innerHeight;
    var pr = renderer.getPixelRatio();
    var w = Math.floor(W * pr), h = Math.floor(H * pr);
    if (rtScene) { rtScene.dispose(); rtA.dispose(); rtB.dispose(); }
    rtScene = makeRT(w, h, true);
    // depth for the screen space occlusion. UnsignedShort would not resolve a
    // 0.02 m difference at 30 m, so this is 24 bit.
    var dt = new THREE.DepthTexture(Math.max(1, w), Math.max(1, h));
    dt.type = THREE.UnsignedIntType;
    dt.minFilter = THREE.NearestFilter; dt.magFilter = THREE.NearestFilter;
    rtScene.depthTexture = dt;
    compMat.uniforms.tDepth.value = dt;
    compMat.uniforms.uRes.value.set(Math.max(1, w), Math.max(1, h));
    rtA = makeRT(Math.floor(w/4), Math.floor(h/4), true);
    rtB = makeRT(Math.floor(w/4), Math.floor(h/4), true);
    compMat.uniforms.uVig.value = 0.55;
  }

  function pass(mat, target){
    quad.material = mat;
    renderer.setRenderTarget(target);
    renderer.clear();
    renderer.render(quadScene, quadCam);
  }

  function render(scene, camera, t){
    renderer.setRenderTarget(rtScene);
    renderer.clear();
    renderer.render(scene, camera);
    // keep the scene pass stats before the composite passes overwrite them:
    // renderer.info resets on every render call, so reading it later is useless
    window.__calls = renderer.info.render.calls;
    window.__tris = renderer.info.render.triangles;

    brightMat.uniforms.tDiffuse.value = rtScene.texture;
    pass(brightMat, rtA);

    blurMat.uniforms.tDiffuse.value = rtA.texture;
    blurMat.uniforms.dir.value.set(1.6/rtA.width, 0);
    pass(blurMat, rtB);

    blurMat.uniforms.tDiffuse.value = rtB.texture;
    blurMat.uniforms.dir.value.set(0, 1.6/rtA.height);
    pass(blurMat, rtA);

    compMat.uniforms.tDiffuse.value = rtScene.texture;
    compMat.uniforms.tBloom.value = rtA.texture;
    compMat.uniforms.uTime.value = t;
    // pixels per metre at one metre of depth, so the occlusion radius is a real
    // 52 cm of world no matter what the field of view is doing
    compMat.uniforms.uProj.value = (rtScene.height * 0.5) / Math.tan(camera.fov * Math.PI / 360);
    quad.material = compMat;
    renderer.setRenderTarget(null);
    renderer.render(quadScene, quadCam);
  }

  resize();
  return { render: render, resize: resize, uniforms: compMat.uniforms };
})();

// ---------------------------------------------------------------- game flow
function setCP(i){
  if (i <= G.cp) return;
  var L = routeList();
  G.cp = i;
  G.msg = 'MARKER — ' + L[i].label;
  G.msgT = 1.6;
  document.querySelector('#cp b').textContent = L[i].label;
}

function reset(full){
  var c = routeList()[full ? 0 : G.cp];
  if (MODE === 'car' && !full){
    // on the car run the marker is where the car goes back to, not the player
    CAR.pos.set(c.x, c.y + 0.02, c.z);
    CAR.yaw = c.yaw; CAR.vel.set(0,0,0); CAR.vy = 0;
    CAR.pitch = 0; CAR.roll = 0;
    animateCar();
    return;
  }
  P.pos.set(c.x, c.y + 0.02, c.z);
  P.vel.set(0, 0, 0);
  P.vault = null;
  P.grounded = true; P.coyote = 0; P.jumpBuffer = 0;
  G.running = full ? false : G.running;
  CAM.yaw = c.yaw; CAM.idle = 9;
  AV.yaw = c.yaw;
  AV.root.position.set(P.pos.x, P.pos.y, P.pos.z);
  if (full){ G.cp = 0; G.time = 0;
    document.querySelector('#cp b').textContent = routeList()[0].label;
    // the level decides which body is on the start line. This used to force
    // foot mode and park the car every time, which is why the car level still
    // started you walking.
    if (LEVEL.startInCar){
      MODE = 'car';
      CAR.pos.set(c.x, (c.y || 0) + 0.02, c.z);
      CAR.yaw = c.yaw || 0;
      CARCAM.yaw = CAR.yaw;
      avatarSet(false); torch.visible = false;
      camera.add(torch); camera.add(torch.target);
    } else {
      MODE = 'foot';
      CAR.pos.set(5.6, 0, 12.6); CAR.yaw = 0;
      avatarSet(true); torch.visible = true;
    }
    CAR.vel.set(0, 0, 0); CAR.vy = 0;
    CAR.steer = 0; CAR.pitch = 0; CAR.roll = 0;
    animateCar();
  }
}

function start(){
  document.getElementById('screen').style.display = 'none';
  document.getElementById('hud').classList.add('on');
  UI_SIG = '';              // force the control UI to redraw for this mode
  // the level decides whether this run starts in the car or on foot. Set the
  // mode before reset, because reset puts whichever body is active on the
  // start marker.
  if (LEVEL.startInCar && MODE !== 'car') enterCar();
  if (!LEVEL.startInCar && MODE === 'car') exitCar();
  refreshUI();
  G.mode = 'play';
  G.running = false; G.time = 0; G.cp = 0;
  reset(true);
  AV.yaw = CAM.yaw;
  AV.root.position.set(P.pos.x, P.pos.y, P.pos.z);
  document.querySelector('#cp b').textContent = LEVEL.route[0].label;
  G.msg = LEVEL.name; G.msgT = 3.0;
  if (CAM.mode === 'third'){ AV.root.add(torch); AV.root.add(torch.target); }
  if (!IS_TOUCH){ var p = canvas.requestPointerLock(); if (p && p.catch) p.catch(function(){}); }
}

function finish(){
  G.mode = 'done';
  G.running = false;
  if (document.exitPointerLock) document.exitPointerLock();
  var t = G.time.toFixed(2);
  var isCar = (MODE === 'car');
  var key = isCar ? 'dl_course_best_car' : 'dl_course_best';
  var prev = isCar ? G.bestCar : G.bestFoot;
  var best = false;
  if (prev === null || G.time < prev){
    best = true;
    if (isCar) G.bestCar = G.time; else G.bestFoot = G.time;
    try { localStorage.setItem(key, String(G.time)); } catch(e){}
  }
  var shown = isCar ? G.bestCar : G.bestFoot;
  var copy = isCar
    ? 'That is the lap. Ramp, the drop off the gantry, and the long run home.'
    : 'That is the high point of the yard. Run it again and carry more of it.';
  var s = document.getElementById('screen');
  s.style.display = 'flex';
  s.innerHTML = '<h1 style="color:#9dffbe">' + t + '</h1>' +
    '<h2>' + (best ? 'NEW BEST' : 'BEST ' + shown.toFixed(2)) + '</h2>' +
    '<p>' + copy + '</p>' +
    '<button id="go">RUN AGAIN</button>';
  document.getElementById('go').addEventListener('click', function(){ location.reload(); });
}

function bestNow(){ return MODE === 'car' ? G.bestCar : G.bestFoot; }

// ---------------------------------------------------------------- loop
var clock = new THREE.Clock();
var FPS = { n:0, t:0 };
function frame(){
  var dt = Math.min(clock.getDelta(), 0.05);
  FPS.n++; FPS.t += dt;
  if (FPS.t > 0.5){ window.__fps = Math.round(FPS.n / FPS.t); FPS.n = 0; FPS.t = 0; }
  refreshUI();
  if (G.mode === 'play' && !G.pause) update(dt);

  // the shadow camera is 110 m across, sized for the yard. Out on the circuit
  // the car was leaving that box, and outside a shadow frustum the sampler
  // clamps to the texture edge, so patches of ground flip between lit and
  // shadowed as you drive. That reads as lights flickering on the road. The
  // sun now travels with whoever is playing.
  focusSun();

  if (window.POST_ON === false){
    renderer.setRenderTarget(null);
    renderer.render(scene, camera);
  } else {
    POST.render(scene, camera, performance.now() * 0.001);
  }
  requestAnimationFrame(frame);
}

function updateCar(dt){
  // The walking body must never be on screen while you are driving. It spawned
  // on the same spot as the car, so a visible avatar is a white lump sitting on
  // the bonnet. Enforced every frame rather than only at the transitions,
  // because one missed path is all it takes.
  var avShown = AV.root.visible;
  if (!avShown && AV.meshes) for (var _i = 0; _i < AV.meshes.length; _i++) if (AV.meshes[_i].visible){ avShown = true; break; }
  if (avShown){ avatarSet(false); torch.visible = false; }
  if (!G.running && G.mode === 'play' && (keys['KeyW'] || keys['ArrowUp'])){
    G.running = true;
  }
  if (G.running) G.time += dt;
  stepCar(dt);
  animateCar();
  placeCarCamera(dt);

  document.querySelector('#clock').innerHTML = G.time.toFixed(2) + '<small>RUN</small>';
  document.getElementById('best').innerHTML = bestNow() === null ? 'NO TIME SET' : 'BEST ' + bestNow().toFixed(2);
  var kmh = Math.hypot(CAR.vel.x, CAR.vel.z) * 3.6;
  document.getElementById('spd').textContent = kmh.toFixed(0) + ' KM/H · CAR' +
    (CAR.grounded ? '' : ' · AIR') + (CAR.hand ? ' · HANDBRAKE' : '');
  if (G.msgT > 0){ G.msgT -= dt; document.getElementById('msg').textContent = G.msg; }
  else document.getElementById('msg').textContent = '';

  // the car run counts: markers and finish, sized for a 4.3 m car but no
  // wider than the gate, or you can clip a marker 4 m off line and then cut
  // the corner into the ramp guard
  var L = routeList();
  for (var i=1;i<L.length;i++){
    var c = L[i];
    if (Math.abs(CAR.pos.x - c.x) < 4.5 && Math.abs(CAR.pos.z - c.z) < 4.5 &&
        Math.abs(CAR.pos.y - (c.y || 0)) < 2.6) setCP(i);
  }
  // the finish only counts once every marker is behind you, or the car
  // flying over the landing lights trips it in mid air
  var F = finishPoint();
  if (G.mode === 'play' && G.cp >= L.length - 1 &&
      Math.abs(CAR.pos.x - F.x) < 6.0 && Math.abs(CAR.pos.z - F.z) < 6.0 &&
      Math.abs(CAR.pos.y - (F.y || 0)) < 3.0){ finish(); return; }
}

function update(dt){
  if (MODE === 'car'){ updateCar(dt); return; }
  var fwd = 0, side = 0;
  if (keys['KeyW'] || keys['ArrowUp']) fwd += 1;
  if (keys['KeyS'] || keys['ArrowDown']) fwd -= 1;
  if (keys['KeyA'] || keys['ArrowLeft']) side -= 1;
  if (keys['KeyD'] || keys['ArrowRight']) side += 1;
  if (STICK.active){ fwd += -STICK.y; side += STICK.x; }

  var moving = Math.abs(fwd) + Math.abs(side) > 0.12;
  var running = (keys['ShiftLeft'] || keys['ShiftRight'] || (STICK.active && Math.hypot(STICK.x, STICK.y) > 0.9)) && moving;

  if (moving && !G.running){ G.running = true; }
  if (G.running) G.time += dt;

  var len = Math.hypot(fwd, side);
  if (len > 1){ fwd /= len; side /= len; len = 1; }

  var sinY = Math.sin(CAM.yaw), cosY = Math.cos(CAM.yaw);
  var wishX = (-fwd*sinY + side*cosY);
  var wishZ = (-fwd*cosY - side*sinY);
  if (len > 0.02 && !P.vault){
    var wantYaw = Math.atan2(-wishX, -wishZ);
    var d = ((wantYaw - AV.yaw + Math.PI*3) % (Math.PI*2)) - Math.PI;
    AV.yaw += d * Math.min(1, dt * 11);
  }

  // momentum. Speed climbs toward walk/run, the velocity you already have is
  // steered rather than replaced, and nothing is scrubbed while you are in the
  // air. A vault or a long fall therefore carries into the next beat.
  if (!P.vault){
    var want = running ? TUNE.run : TUNE.walk;
    var spd = Math.hypot(P.vel.x, P.vel.z);
    if (len > 0.02){
      var mag = spd;
      if (mag < want) mag = Math.min(want, mag + (P.grounded ? TUNE.accelG : TUNE.accelA) * dt);
      else if (P.grounded && mag > want + 0.02) mag = Math.max(want, mag - TUNE.brakeG * dt);
      var curYaw = spd > 0.02 ? Math.atan2(P.vel.x, P.vel.z) : Math.atan2(wishX, wishZ);
      var wYaw = Math.atan2(wishX, wishZ);
      var dd = ((wYaw - curYaw + Math.PI*3) % (Math.PI*2)) - Math.PI;
      var rate = (P.grounded ? TUNE.steerG : TUNE.steerA) * dt;
      curYaw += Math.max(-rate, Math.min(rate, dd));
      P.vel.x = Math.sin(curYaw) * mag;
      P.vel.z = Math.cos(curYaw) * mag;
    } else {
      var br = Math.min(1, (P.grounded ? TUNE.brakeG : TUNE.brakeA) * dt);
      P.vel.x -= P.vel.x * br;
      P.vel.z -= P.vel.z * br;
    }
  }

  // jump with coyote time and a small input buffer
  P.coyote = P.grounded ? TUNE.coyote : Math.max(0, P.coyote - dt);
  P.jumpBuffer = Math.max(0, P.jumpBuffer - dt);
  if (P.jumpBuffer > 0 && P.coyote > 0 && !P.vault){
    P.vel.y = TUNE.jump;
    P.grounded = false; P.coyote = 0; P.jumpBuffer = 0;
  }

  moveAndCollide(dt);

  // the yard floor is ground, not lava. falling costs you the climb, not the run.
  if (P.pos.y < -6) { reset(false); G.msg = 'BACK TO ' + routeList()[G.cp].label; G.msgT = 1.5; }

  // markers and finish
  var FL = routeList();
  for (var i=1;i<FL.length;i++){
    var c = FL[i];
    if (Math.abs(P.pos.x - c.x) < 1.5 && Math.abs(P.pos.z - c.z) < 1.5 && Math.abs(P.pos.y - (c.y||0)) < 0.7) setCP(i);
  }
  var FF = finishPoint();
  if (Math.abs(P.pos.x - FF.x) < 3.4 && Math.abs(P.pos.z - FF.z) < 3.2 && Math.abs(P.pos.y - (FF.y||0)) < 0.7){
    finish(); return;
  }

  // body and camera
  animateAvatar(dt, Math.hypot(P.vel.x, P.vel.z));
  placeCamera(dt);

  // hud
  document.querySelector('#clock').innerHTML = G.time.toFixed(2) + '<small>RUN</small>';
  document.getElementById('best').innerHTML = bestNow() === null ? 'NO TIME SET' : 'BEST ' + bestNow().toFixed(2);
  // nothing tells you the car is enterable unless the game says so
  if (nearCar() && G.msgT <= 0){ G.msg = 'E · GET IN THE ARROW'; G.msgT = 0.25; }
  var spdNow = Math.hypot(P.vel.x, P.vel.z);
  document.getElementById('spd').textContent = spdNow.toFixed(1) + ' M/S' + (P.vault ? ' · VAULT' : '');
  if (G.msgT > 0){ G.msgT -= dt; document.getElementById('msg').textContent = G.msg; }
  else document.getElementById('msg').textContent = '';
}

document.getElementById('go').addEventListener('click', start);
window.addEventListener('resize', function(){
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  POST.resize();
});

window.COURSE = {
  TUNE: TUNE,
  CARTUNE: CARTUNE,
  // the touch button label is drawn by the render loop, which does not run in a
  // headless test browser, so expose it to be callable
  ui: function(){    UI_SIG = ''; refreshUI();
    var g = function(id){ return getComputedStyle(document.getElementById(id)).display; };
    return { stick: g('stick') + '/' + document.getElementById('stick').getAttribute('data-label'),
             jump: document.getElementById('btnJump').textContent + '/' + g('btnJump'),
             act:  document.getElementById('btnAct').textContent + '/' + g('btnAct'),
             look: g('lookhint'), keys: g('keys') };
  },
  useTouch: function(on){ useTouch(on); UI_SIG = ''; refreshUI(); return TOUCH.using; },
  stick: function(x, y, on){ STICK.active = !!on; STICK.x = x; STICK.y = y; return {x:STICK.x, y:STICK.y, on:STICK.active}; },
  surfaceAt: surfaceAt,
  boxes: function(){ return boxes.map(function(b){ return {name:b.name, x0:+b.x0.toFixed(2), x1:+b.x1.toFixed(2), z0:+b.z0.toFixed(2), z1:+b.z1.toFixed(2), y0:+b.y0.toFixed(2), y1:+b.y1.toFixed(2)}; }); },
  ramps: function(){ return ramps.map(function(r){ return {x0:+r.x0.toFixed(2), x1:+r.x1.toFixed(2), z0:+r.z0.toFixed(2), z1:+r.z1.toFixed(2), y0:+r.y0.toFixed(2), y1:+r.y1.toFixed(2)}; }); },
  car: function(){
    return { mode: MODE, yaw:+CAR.yaw.toFixed(2), grounded: CAR.grounded,
             kmh:+ (Math.hypot(CAR.vel.x, CAR.vel.z)*3.6).toFixed(1),
             pos:[+CAR.pos.x.toFixed(2), +CAR.pos.y.toFixed(2), +CAR.pos.z.toFixed(2)],
             pitch:+CAR.pitch.toFixed(3), roll:+CAR.roll.toFixed(3),
             hand: (!!keys['Space'] || TOUCH.hand),
             lat: +Math.abs(CAR.vel.x * Math.cos(CAR.yaw) - CAR.vel.z * Math.sin(CAR.yaw)).toFixed(2),
             hit: CAR.lastHit || '' };
  },
  carcam: function(){ return { yaw:+CARCAM.yaw.toFixed(3), pitch:+CARCAM.pitch.toFixed(3) }; },
  // aiming the chase camera from a test. The camera swings itself back to the
  // car's heading after 0.7 s without a mouse move, so a probe that only writes
  // yaw gets a frame of the old direction; this also resets the idle timer.
  carLook: function(y, p){
    if (typeof y === 'number') CARCAM.yaw = y;
    if (typeof p === 'number') CARCAM.pitch = p;
    CARCAM.idle = 0;
    return { yaw:+CARCAM.yaw.toFixed(3), pitch:+CARCAM.pitch.toFixed(3) };
  },
  enterCar: function(){ enterCar(); },
  perf: function(){ return { calls: window.__calls || 0,
                             tris: window.__tris || 0,
                             programs: renderer.info.programs.length,
                             textures: renderer.info.memory.textures,
                             geometries: renderer.info.memory.geometries,
                             fps: window.__fps || 0 }; },
  focusSun: function(){ focusSun();
    return { sun: [+sun.position.x.toFixed(1), +sun.position.z.toFixed(1)],
             target: [+sun.target.position.x.toFixed(1), +sun.target.position.z.toFixed(1)] }; },
  level: function(){ return { id: LEVEL.id, name: LEVEL.name, mode: LEVEL.mode,
                             startInCar: !!LEVEL.startInCar, gates: LEVEL.route.length,
                             route: LEVEL.route, finish: LEVEL.finish }; },
  exitCar: function(){ exitCar(); },
  carTo: function(x, z, yaw){ CAR.pos.set(x, 0.02, z); CAR.yaw = yaw || 0;
    CAR.vel.set(0,0,0); CAR.vy = 0; CAR.pitch = 0; CAR.roll = 0; animateCar(); },
  state: function(){
    var spd = Math.hypot(P.vel.x, P.vel.z);
    return { mode:G.mode, time:+G.time.toFixed(2), cp:G.cp, grounded:P.grounded,
             vault: !!P.vault, spd:+spd.toFixed(2),
             pos:[+P.pos.x.toFixed(2), +P.pos.y.toFixed(2), +P.pos.z.toFixed(2)],
             vel:[+P.vel.x.toFixed(2), +P.vel.y.toFixed(2), +P.vel.z.toFixed(2)],
             pads: boxes.length, ramps: ramps.length, fov:+camera.fov.toFixed(1),
             camYaw:+CAM.yaw.toFixed(3),
             ready: window.YARD_READY === true, cam: CAM.mode, camDist: +CAM.cur.toFixed(2) };
  },
  place: function(x, y, z){ P.pos.set(x, y, z); P.vel.set(0,0,0); P.vault = null; P.grounded = false; },
  look: function(yaw, pitch){ CAM.yaw = yaw; if (pitch !== undefined) CAM.pitch = -pitch; CAM.idle = 0; },
  cam: function(mode){ CAM.mode = mode; },
  respawn: function(i){ G.cp = i === undefined ? G.cp : i; reset(false); },
  // deterministic test driver: freeze the render loop, step the sim by hand
  sim: function(n, dt){
    G.pause = true;
    for (var i=0;i<(n||1);i++) update(dt || 1/60);
    return this.state();
  },
  resume: function(){ G.pause = false; },
  press: function(code, down){ keys[code] = !!down; },
  dbg: function(){ return { scene: scene, av: AV, camera: camera, P: P, ch: CH, act: ACT, renderer: renderer, holder: HOLDER }; },
  screen: function(y){
    var v = new THREE.Vector3(AV.root.position.x, AV.root.position.y + (y||1.0), AV.root.position.z);
    v.project(camera);
    return { x: (v.x*0.5+0.5)*window.innerWidth, y: (-v.y*0.5+0.5)*window.innerHeight };
  },
  jump: function(){ P.jumpBuffer = 0.16; },
  start: start
};
frame();
})();
</script>
</body>
